    i2: 'Os ossos de um guerreiro antigo levantam-se do chão para obedecer ao invocador.',
    i11: 'Correntes feitas de almas presas, que se enrolam no inimigo e lhe roubam força.',
    i3: 'Um fio de vida sai do corpo do inimigo e entra no do invocador. O que um perde, o outro ganha.',
    i12: 'Uma lanterna que guarda almas perdidas. A luz dela devolve mana ao invocador a cada turno.',
    i4: 'Um pacto selado com os mortos. As invocações ficam mais fortes e a magia do invocador também.',
    i13: 'Uma matilha de cães espectrais que nunca se cansa e nunca larga a presa.',
    i5: 'Um cavaleiro que morreu em batalha e jurou servir quem o chamasse. Luta sem medo, porque já morreu uma vez.',
    i14: 'Um escudo feito de ossos entrelaçados, de criaturas que o invocador derrotou.',
    i6: 'Uma maldição antiga que pesa no coração do inimigo. O ataque fraqueja e a defesa cede.',
    i15: 'Uma foice que ceifa almas em vez de trigo. Cada golpe devolve vida a quem a empunha.',
    i7: 'Uma legião inteira de soldados espectrais marcha atrás do invocador.',
    i16: 'O invocador coloca a coroa dos mortos. Todas as invocações respondem com mais força.',
    i8: 'Todas as almas que o invocador guarda são libertadas de uma vez, numa explosão de gritos.',
    i17: 'Um titã espectral do tamanho de uma torre levanta-se do chão e luta pelo invocador.',
    i18: 'Ondas de almas avançam como um mar e arrastam o inimigo, devolvendo vida ao invocador.',
    i9: 'A técnica final do caminho das almas: um exército eterno, sentado à volta de um trono escuro, que nunca para de lutar.',
    // ---------- Gerais ----------
    c1: 'Fechar os olhos, acalmar a respiração e deixar a mana voltar. Um momento de paz no meio da batalha.',
    c5: 'Uma respiração profunda e controlada. Não custa mana, só alguns segundos de coragem.',
    c2: 'Quando o corpo está prestes a desistir, surge um segundo fôlego que ninguém sabia que existia.',
    c3: 'Um arrepio na nuca segundos antes do golpe. O corpo desvia-se antes de a cabeça perceber porquê.',
    c6: 'A mente fica limpa e o mundo abranda. Os golpes certeiros tornam-se mais frequentes e mais fortes.',
    c4: 'Uma vontade que não se parte. Uma vez por batalha, o golpe que devia matar deixa-te de pé, com um sopro de vida.',
    // ---------- Secretas ----------
    s1: 'A luz azul do Sistema desce sobre a tua arma no momento do despertar. A lâmina usa sempre a tua maior força, seja física ou mágica.',
    s2: 'Um coração de dragão começa a bater no teu peito. Tudo em ti fica mais forte.',
    s3: 'O olhar de um rei não pede obediência: exige-a. O inimigo hesita, fraqueja e por vezes nem se mexe.',
    s4: 'Quem cai muitas vezes aprende a levantar-se. Uma vez por batalha, renasces das cinzas.',
    s5: 'A ampulheta partida deu-te o segredo: o tempo para. O inimigo fica imóvel e as tuas recargas voltam ao início.',
    s6: 'Trinta dias de disciplina abriram o caminho do monge. O corpo cura-se sozinho a cada turno.',
    s7: 'A raiva de todas as derrotas acumuladas. Quanto mais perto estás do fim, mais forte bates.',
    s8: 'Reuniste os fragmentos e o Sistema reconhece-te como uma das suas autoridades. Usas o poder dele contra os inimigos e recuperas vida.',
    s9: 'O golpe que só um soberano pode dar. Atravessa qualquer defesa, porque nada no Sistema foi feito para o deter.',
    s10: 'Cem dias de hábito transformaram-se em sabedoria. Aprendes mais com cada coisa que fazes.'
  };
})(globalThis.SYS = globalThis.SYS || {});

/* src/data/lore-bosses.js */
/* ==========================================================
   CRÓNICAS DOS CHEFES
   Texto narrativo mostrado na janela de informação de cada chefe.
   ========================================================== */
(function (S) {
  'use strict';

  /* Descrição de cada portão (aparece por cima da crónica do chefe) */
  S.GATE_LORE = {
    1: 'Uma floresta antiga onde as árvores falam entre si em sussurros. Foi o primeiro portão a abrir-se no mundo, e por isso é o mais vivo: tudo aqui caça, tudo aqui tem fome.',
    2: 'Túneis que brilham sozinhos, escavados por algo que não era humano. O cristal guarda ecos: quem fala alto demais ouve a própria voz voltar, anos depois.',
    3: 'Água parada, ar espesso e uma névoa verde que nunca levanta. Aquilo que morre no pântano não apodrece em paz: continua a mexer-se.',
    4: 'O que resta de um império que adorava o sol. As areias escondem templos inteiros, e os seus guardiões ainda cumprem ordens dadas há mil anos.',
    5: 'Uma fortaleza erguida no gelo por gigantes que já não existem. O frio aqui não é clima: é uma vontade, e essa vontade quer-te imóvel.',
    6: 'O coração de um vulcão que nunca adormeceu. A rocha corre como rio e os demónios forjam nas suas margens armas para uma guerra que ainda não começou.',
    7: 'Uma cidade inteira engolida pelo mar numa só noite. Os sinos ainda tocam debaixo de água, e os afogados ainda respondem.',
    8: 'Um castelo suspenso acima das nuvens, onde os anjos deixaram de ouvir as orações e começaram a ouvir apenas a própria glória.',
    9: 'Um buraco no mundo sem fundo conhecido. Quem cai não chega ao chão: chega a outro sítio, e esse sítio olha de volta.',
    10: 'O lugar onde os portões nascem. Não há céu, não há chão, só um trono no meio do nada e a sensação de que alguém te observa desde o primeiro dia.',
    0: 'Portões que não constam de nenhum registo do Sistema. Existem nas margens, onde as regras se dobram.'
  };

  S.BOSS_LORE = {
    // ---------- Portão 1: Floresta Sussurrante ----------
    b1: 'Era o mais velho da matilha muito antes de o portão se abrir. Quando a magia do Sistema tocou a floresta, foi o primeiro a beber dela, e os seus olhos ficaram da cor da lua. Caça sozinho desde então: diz-se que comeu os irmãos para não ter de partilhar o poder.',
    b2: 'Um javali que cresceu a comer raízes impregnadas de mana até as presas lhe ficarem duras como ferro forjado. Não pensa, não negoceia, não recua. Carrega contra tudo o que se mexe e já derrubou árvores com mais de três séculos.',
    b3: 'Tece teias tão finas que só se veem quando a luz da manhã lhes bate. Guarda nelas os restos de caçadores antigos, embrulhados como presentes, e lembra-se do nome de cada um. A seda dela é veneno: quem lhe toca começa a adormecer.',
    b4: 'Ruk não era o goblin mais forte da tribo, mas era o mais barulhento. Matou o antigo chefe com um cutelo roubado e desde então governa à base de gritos e medo. Por baixo da arrogância, tem pavor de voltar a ser ninguém.',
    b5: 'Dormiu durante um século debaixo de uma camada de musgo tão espessa que as aves faziam ninhos no seu dorso. O portão acordou-o com fome e mau humor. As garras dele têm líquenes que nunca deixam as feridas fechar bem.',
    b6: 'Foi a árvore mais antiga da floresta, onde os druidas faziam juramentos. Quando a magia corrompida lhe entrou pelas raízes, a seiva ficou negra e o tronco abriu uma boca. Agora alimenta-se dos que se sentam à sua sombra.',
    b7: 'Rainha de uma colmeia do tamanho de uma aldeia. Comunica com as filhas através de um zumbido que faz doer os dentes. Cada vespa dela carrega uma gota de veneno, e ela carrega o veneno de todas.',
    b8: 'Xamã da tribo de Ruk, e o verdadeiro poder por trás do trono. Fala com espíritos que só ele ouve e usa um cajado com a caveira do mestre que o ensinou. As suas maldições não matam: enfraquecem, até o resto do trabalho ser fácil.',
    b9: 'Nasceu entre as raízes da árvore-mãe e cresceu enrolada nelas, até já não se saber onde acaba a serpente e começa a madeira. Sente cada passo que se dá na floresta através do chão. Ataca sempre de onde não se espera.',
    b10: 'Fenrath não nasceu rei: conquistou a coroa matando o alfa anterior numa noite sem lua. Desde então, nenhum lobo da floresta uiva sem a sua permissão. É inteligente, paciente e cruel, e lembra-se de todos os caçadores que fugiram dele.',
    // ---------- Portão 2: Cavernas de Cristal ----------
    b11: 'Cego desde que nasceu, vê através do eco. Nas cavernas de cristal, cada som volta multiplicado, e ele aprendeu a ouvir o bater de um coração a cem metros. Bebe sangue para se manter quente no frio das profundezas.',
    b12: 'Construído pela Rainha Cristalina a partir de quartzo vivo, para guardar a entrada do seu reino. Não tem vontade própria, só ordens. O núcleo que lhe bate no peito é um cristal que a rainha arrancou do próprio trono.',
    b13: 'Um lagarto cujas escamas se transformaram em cristal depois de dormir anos sobre um veio de mana pura. Brilha quando ataca, e esse brilho cega quem o olha de frente. Coleciona tudo o que reluz, incluindo dentes.',
    b14: 'Um mineiro humano que entrou nas cavernas para procurar fortuna e nunca saiu. Encontrou um cristal amaldiçoado e não o largou. A lanterna dele ainda arde, cem anos depois, com uma chama que não é fogo.',
    b15: 'O melhor ferreiro das profundezas. Os kobolds dizem que forjou armas para reis de portões que já caíram. Trabalha sem descanso numa bigorna aquecida por cristais de fogo, e tem orgulho de cada golpe que dá.',
    b16: 'Um verme do tamanho de um túnel, que escava a rocha com um anel de dentes de diamante. Grande parte das passagens das cavernas foram abertas por ele. Quando se aproxima, a terra treme e as estalactites caem.',
    b17: 'Uma tempestade de cristais roxos com vontade própria. Nasceu do excesso de mana acumulado numa gruta fechada. Não tem corpo fixo: desfaz-se e refaz-se, e bebe a mana de quem se aproxima para continuar a existir.',
    b18: 'Um troll que desceu às profundezas há gerações e se esqueceu do caminho de volta. A pele dele cicatriza mais depressa do que se consegue cortar. Usa como clava um pedaço de cristal que pesa mais do que um cavalo.',
    b19: 'A última guarda pessoal da Rainha Cristalina. Fica de pé diante da porta do trono há tanto tempo que os pés se fundiram com o chão. Tem uma única ordem gravada no peito: ninguém passa.',
    b20: 'Varyss era uma princesa humana que se perdeu nas cavernas e foi encontrada pelo cristal. Ele prometeu-lhe beleza eterna, e cumpriu. Agora reina sobre uma galeria de estátuas: todos os que entraram e não souberam sair.',
    // ---------- Portão 3: Pântano Pútrido ----------
    b21: 'Um sapo que engoliu tanta água contaminada que o próprio corpo passou a produzir ácido. A língua derrete armaduras e a pele queima ao toque. É mais esperto do que parece: espera imóvel durante dias pela presa certa.',
    b22: 'Vive numa cabana sobre estacas, cozinhando venenos num caldeirão que nunca arrefece. Diz que já foi curandeira numa aldeia que a expulsou. O lodo responde-lhe como um animal de estimação.',
    b23: 'Um crocodilo com uma carapaça de placas de osso tão grossas que as flechas lhe ressaltam. Afunda-se no lodo e fica à espera, só com os olhos à superfície. Quando morde, não larga.',
    b24: 'Ainda é jovem, e por isso só tem cinco cabeças. Cada uma pensa de forma diferente, e discutem entre si durante o combate. Corta-se uma e nascem duas: a única forma de a vencer é ser mais rápido do que ela cresce.',
    b25: 'Um fungo gigante que cresce sobre os corpos de quem morreu no pântano. Liberta nuvens de esporos que adormecem, envenenam e, mais tarde, fazem crescer novos cogumelos dentro de quem os respirou.',
    b26: 'Afogou-se no pântano numa noite de nevoeiro, a tentar salvar alguém. A água não o deixou ir. Agora vagueia arrastando correntes que não se lembra de ter, e puxa para o fundo todos os que lhe estendem a mão.',
    b27: 'Uma sanguessuga do tamanho de um barco, que vive no fundo das águas mais escuras. Quando se agarra, suga tanto sangue que a vítima fica pálida em segundos. Regenera-se com o que bebe.',
    b28: 'Um lagarto que roubou um grimório a um mago afogado e aprendeu a ler sozinho. A magia dele é desajeitada mas perigosa, e cheira a pântano queimado. Sonha ser respeitado pelos magos da superfície.',
    b29: 'Uma árvore morta onde a aldeia antiga castigava os traidores. As cordas nunca apodreceram e os ramos ainda se mexem com o vento, mesmo quando não há vento. Dizem que as almas dos enforcados ainda estão presas à casca.',
    b30: 'Morvenna era a alquimista que tentou curar a praga do pântano e acabou por se tornar a própria praga. Usa uma máscara de bico cheia de ervas para não sentir o cheiro de si mesma. Onde ela passa, as plantas murcham e a água fica verde.',
    // ---------- Portão 4: Ruínas do Deserto ----------
    b31: 'Um escorpião com uma carapaça dourada que os sacerdotes antigos veneravam como mensageiro do sol. O ferrão contém veneno suficiente para derrubar um camelo. Gosta de enterrar-se na areia quente e esperar.',
    b32: 'Uma múmia que ainda cumpre a última ordem do faraó: guardar o túmulo até ao fim dos tempos. As ligaduras estão impregnadas de óleos sagrados que a mantêm de pé e lhe fecham as feridas.',
    b33: 'Um verme gigantesco que nada sob a areia como um peixe na água. Antes de atacar, o chão vibra e as dunas mudam de forma. Engoliu caravanas inteiras, e algumas ainda estão lá dentro, dizem.',
    b34: 'Um sacerdote com cabeça de chacal que guarda os ritos de passagem dos mortos. Pesa a alma de cada intruso numa balança dourada, e a balança nunca lhe dá razão. Rouba a energia de quem lhe mente.',
    b35: 'Um golem esculpido em arenito pelos construtores do império, com hieróglifos gravados no corpo inteiro. As inscrições contam a história da sua criação, e a última linha diz apenas: obedece.',
    b36: 'Um génio que foi aprisionado numa lâmpada durante mil anos e libertado por um ladrão descuidado. Concede desejos, mas sempre com uma armadilha escondida. Tem prazer em ver as pessoas a arrependerem-se do que pediram.',
    b37: 'Guarda a entrada do palácio solar com um enigma que ninguém resolveu. Quem responde mal é devorado; quem tenta passar sem responder também. Na verdade, já se esqueceu da resposta certa.',
    b38: 'Um faraó tão esquecido que nem o nome ficou registado. Foi apagado das paredes pelo próprio filho, e o rancor manteve-o vivo. Suga a vida de quem entra no seu túmulo para recuperar o que lhe roubaram.',
    b39: 'Uma serpente coberta de escamas de ouro puro. O olhar dela paralisa e o veneno queima por dentro. Os ladrões de túmulos chamam-lhe a Avara, porque guarda tesouros que nunca usa.',
    b40: 'Ankharet governou o império do sol durante trezentos anos. Quando a morte lhe veio buscar, recusou-se a ir, e o sol, por respeito, nunca mais se pôs sobre o seu palácio. Combate com a fúria de quem já perdeu tudo menos o orgulho.',
    // ---------- Portão 5: Fortaleza de Gelo ----------
    b41: 'Um yeti mais velho do que a própria fortaleza. A pelagem branca está coberta de gelo que nunca derrete, e o rugido provoca avalanches. Os gigantes usavam-no como sentinela, e ele continua a vigiar.',
    b42: 'Um lobo feito de neve compactada e vento cortante. Caça em silêncio absoluto, e os seus uivos só se ouvem depois de ter atacado. Dizem que é o fantasma de um dos irmãos de Fenrath.',
    b43: 'Um cavaleiro que jurou proteger a fortaleza e morreu congelado no posto. O gelo manteve-o de pé, e o juramento manteve-o a lutar. A armadura dele ficou tão dura que nenhuma lâmina comum a risca.',
    b44: 'Um mago que procurou a imortalidade no frio absoluto e encontrou-a. Guarda a alma num filactério de gelo escondido na fortaleza. Fala devagar, porque tem todo o tempo do mundo.',
    b45: 'Um mamute treinado para a guerra pelos gigantes, com armadura de ferro e presas reforçadas. Ainda carrega no dorso a torre de onde os arqueiros gigantes disparavam. Uma carga dele deita abaixo muralhas.',
    b46: 'Uma harpia que nasceu no olho de uma tempestade de neve. As penas cortam como lâminas e o grito congela o ar. Ataca sempre em voo picado, protegida pela nevasca que a acompanha.',
    b47: 'O último dos gigantes de gelo que construíram a fortaleza. Hrimr ficou para guardar a obra quando os outros partiram para uma guerra de que nunca voltaram. A barba dele é feita de estalactites.',
    b48: 'O lamento de todos os que morreram de frio na fortaleza, reunido num só ser. Não tem rosto, só uma boca que chora. Quando se aproxima, o calor do corpo começa a fugir.',
    b49: 'Um dragão jovem de escamas brancas que ainda não aprendeu a ter paciência. O sopro dele congela rios inteiros. É orgulhoso e impulsivo, e quer provar à rainha que merece um lugar ao lado do trono.',
    b50: 'Skadhi foi coroada no dia mais frio de que há memória e jurou que o inverno nunca mais acabaria. Cumpriu. O coração dela parou há séculos, mas o gelo continua a obedecer-lhe. Não odeia ninguém: simplesmente já não sente nada.',
    // ---------- Portão 6: Vulcão Carmesim ----------
    b51: 'Uma salamandra que vive dentro da lava e sai à superfície apenas para caçar. A pele dela incendeia tudo o que toca. Move-se tão depressa que deixa rastos de fogo no chão.',
    b52: 'Um golem de rocha derretida, mantido coeso por um núcleo de magma puro. Quando é atingido, endurece; quando se zanga, derrete. Foi criado pelos demónios ferreiros para proteger as forjas.',
    b53: 'Um cão de guerra com duas cabeças que nunca concordam em nada exceto em morder. Os demónios usam-no para caçar fugitivos. A coleira de ferro em brasa tem gravado o nome do dono: um nome que não se deve dizer em voz alta.',
    b54: 'O mestre das forjas do vulcão. Martela metal na lava há mil anos e as armas dele estão em todos os portões. Despreza quem usa armas sem saber como foram feitas.',
    b55: 'Uma fénix que morreu e renasceu tantas vezes dentro do vulcão que as cinzas ficaram contaminadas. Agora renasce corrompida, com penas negras e fogo roxo. Ainda se cura, mas cada renascimento a torna mais cruel.',
    b56: 'Um espírito de fogo puro, nascido de uma erupção. Não sabe fazer nada sem raiva, e a raiva faz-lhe crescer as chamas. Diz-se que a chama dele é eterna e que ninguém a conseguiu apagar.',
    b57: 'Uma serpente que nada em rios de lava e dorme dentro do próprio vulcão. As escamas são rocha fundida que arrefeceu à superfície. Quando se enrola à volta de alguém, a pedra derrete.',
    b58: 'O que resta de um feiticeiro que tentou controlar o vulcão e foi reduzido a cinzas. As cinzas não esqueceram. Rodopiam juntas com a forma de um homem e carregam uma urna com os restos do próprio corpo.',
    b59: 'Um gigante cujo corpo é uma fogueira permanente. Foi convocado pelos demónios para uma guerra contra os céus e ficou esquecido no vulcão quando a guerra foi adiada. Está impaciente.',
    b60: 'Pyraxis dorme no coração do vulcão desde antes de existirem portões. Quando abre os olhos, a montanha acorda com ele. É vaidoso, antigo e terrivelmente inteligente, e considera os humanos apenas fagulhas que se apagam depressa.',
    // ---------- Portão 7: Cidade Submersa ----------
    b61: 'Um polvo gigante que vive nas torres afundadas da cidade. Chamam-lhe menor só porque existe um maior, algures mais fundo. Os tentáculos dele arrastaram barcos inteiros para o fundo.',
    b62: 'Canta nas ruínas da catedral submersa, e a voz dela atravessa a água e a pedra. Quem a ouve esquece-se de respirar. Não é cruel: só se sente sozinha, e quer companhia para sempre.',
    b63: 'Um tubarão que se adaptou às profundezas mais escuras e ficou cego, pálido e enorme. Sente o sangue na água a quilómetros. Os dentes partidos que deixa nas presas voltam a crescer em horas.',
    b64: 'Um soldado tritão da antiga guarda real da cidade. Continua a patrulhar as mesmas ruas, a mesma ronda, todos os dias, desde que a cidade afundou. Não aceita que o reino acabou.',
    b65: 'Uma enguia carregada de eletricidade que ilumina as ruas submersas como um relâmpago azul. Gosta de se esconder nas lâmpadas antigas da cidade. Um só toque dela faz parar o coração.',
    b66: 'Um filhote de leviatã, ainda do tamanho de um navio. A mãe deixou-o a guardar a cidade enquanto foi para o oceano profundo. Cura-se com a água à sua volta e não percebe porque é que tudo o que toca se desfaz.',
    b67: 'A última sacerdotisa do templo do mar. Rezou para salvar a cidade e o mar respondeu, só que à sua maneira: afundou-a para a proteger para sempre. Ela ainda reza, e as marés ainda a ouvem.',
    b68: 'Um caranguejo com uma carapaça tão grande que os habitantes da cidade o confundiam com um edifício. As pinças fecham com força suficiente para partir uma âncora. Leva a vida devagar, mas nunca larga o que apanha.',
    b69: 'Algo que subiu do fundo do oceano quando a cidade afundou. Ninguém sabe o que era antes. É feito de tentáculos, olhos e fome, e envenena tudo o que toca.',
    b70: 'Thalassor foi o rei que, para salvar o trono de uma invasão, fez um pacto com o mar. O mar aceitou, e levou a cidade inteira para o fundo, com ele lá dentro. Reina sobre súbditos afogados e não admite que perdeu.',
    // ---------- Portão 8: Cidadela Celestial ----------
    b71: 'O grifo que transportava os mensageiros dos céus. Quando a cidadela se corrompeu, recusou-se a servir outros donos e ficou a guardar o pátio real. Os voos picados dele são mais rápidos do que flechas.',
    b72: 'Um anjo que caiu por vontade própria, convencido de que a terra precisava de juízes. Descobriu que a terra não queria ser julgada. A auréola partiu-se na queda, e o rancor ficou inteiro.',
    b73: 'Um golem construído pelos anjos em mármore celeste e runas de luz. Foi feito para proteger, mas o código dele foi reescrito. Não distingue amigos de inimigos: só quem tem permissão e quem não tem.',
    b74: 'Uma valquíria que conduzia guerreiros mortos para o paraíso e começou a escolher apenas os que lhe agradavam. Foi expulsa da guarda celeste e jurou vingança. Luta como uma tempestade.',
    b75: 'Um serafim de seis asas que já brilhou mais do que o sol. A luz dele ficou turva e quente demais, e agora queima em vez de iluminar. Ainda canta hinos, mas as letras mudaram.',
    b76: 'O mensageiro dos céus, que anunciava as decisões dos deuses com uma trompa de ouro. Hoje anuncia apenas castigos. O som da trompa dele derruba muros e deixa os ouvidos a sangrar.',
    b77: 'Uma criatura criada pelos alquimistas celestes com partes de leão, águia e serpente, para ser a guardiã perfeita. Saiu perfeita demais: três cabeças, três vontades, três formas de matar.',
    b78: 'O cavaleiro que defendia a cidadela ao nascer do sol. Ainda acredita que serve a luz, e por isso é tão perigoso: luta com a convicção de quem acha que está do lado certo.',

    if (E.hasEffect(st, 'xp15')) m *= 1.5;

  E.coinMultiplier = function (st) {
    var m = 1;

  };

  E.gainXp = function (st, base, useMult) {
    var amount = Math.max(0, Math.round(base * (useMult === false ? 1 : E.xpMultiplier(st))));
    if (st.level >= S.MAX_LEVEL) return 0;
    st.xp += amount;
    st.c.xpEarned = (st.c.xpEarned || 0) + amount;
    while (st.level < S.MAX_LEVEL && st.xp >= S.xpToNext(st.level)) {

      st.level += 1;
      st.freePoints += S.POINTS_PER_LEVEL;
      var newSkills = E.unlockedSkills(st).filter(function (s) { return s.unlock === st.level && !s.secret; });
      E.emit({ type: 'levelup', level: st.level, title: S.titleFor(st.level), skills: newSkills.map(function (s) { return s.name; }) });
      E.history(st, '⬆️', 'Subiu para o nível ' + st.level + ' — ' + S.titleFor(st.level) + '.');

    st.xp -= lost;
    return lost;
  };
  E.gainCoins = function (st, base, useMult) {
    var amount = Math.max(0, Math.round(base * (useMult === false ? 1 : E.coinMultiplier(st))));
    st.coins += amount;
    st.c.coinsEarned = (st.c.coinsEarned || 0) + amount;
    return amount;
  };
  E.loseCoins = function (st, amount) {
    var lost = Math.min(st.coins, Math.max(0, Math.round(amount)));
    st.coins -= lost;
    st.c.coinsLost = (st.c.coinsLost || 0) + lost;
    return lost;
  };
  E.bump = function (st, key, n) { st.c[key] = (st.c[key] || 0) + (n == null ? 1 : n); };

  /* ---------------- loja ---------------- */
  E.price = function (st, id) {
    var it = E.item(id, st);
    if (!it || !it.price) return null;
    var n = st.bought[id] || 0;
    var base = it.price;
    // preço que acompanha o nível (ex.: Selo de Ascensão)
    if (it.priceScale) base = it.priceScale * S.levelMult(st.level) * (1 + st.level / 25);
    var p = base * Math.pow(1 + (it.priceStep || 0), n);
    if (it.priceScale) return Math.round(p / 100) * 100;
    // consumíveis, baús e lazer acompanham o nível, para nunca ficarem baratos
    var f = E.priceFactor(st, it);
    if (f !== 1) return Math.max(10, Math.round(it.price * f / 10) * 10);
    return it.priceStep ? Math.round(p / 10) * 10 : it.price;
  };
  E.priceFactor = function (st, it) {
    if (!it || it.custom) return 1;
    var lm = S.levelMult(st.level);
    if (it.cat === 'consumivel') return lm * (1 + st.level / 40);
    if (it.cat === 'bau' || it.cat === 'lazer') return lm;
    return 1;

  E.canEquipClass = function (st, it) { return !it.cls || it.cls.indexOf(st.cls) >= 0; };
  E.shopList = function (st, tab) {
    var list = Object.keys(S.ITEMS).map(function (k) { return S.ITEMS[k]; })
      .filter(function (it) { return it.cat === tab && it.price && !it.secret; });
    if (tab === 'arma') list = list.filter(function (it) { return E.canEquipClass(st, it); });
    if (tab === 'lazer') list = list.concat(st.customLeisure.map(function (c) { return E.item(c.id, st); }));

  E.buy = function (id, qty) {
    var st = E.state;

    if (!it || !it.price) return { ok: false, msg: 'Este item não está à venda.' };
    var rq = E.reqStatus(st, it);
    if (!rq.ok) return { ok: false, msg: 'Bloqueado: ' + rq.lines.filter(function (l) { return !l.ok; }).map(function (l) { return l.text; }).join(', ') + '.' };
    if (it.cat === 'arma' && !E.canEquipClass(st, it)) return { ok: false, msg: 'A tua classe não pode usar esta arma.' };
    var total = 0;
    var b0 = st.bought[id] || 0;
    for (var i = 0; i < qty; i++) {
      st.bought[id] = b0 + i;
      total += E.price(st, id);
    }
    st.bought[id] = b0;
    if (st.coins < total) return { ok: false, msg: 'Moedas insuficientes (precisas de ' + total + ').' };

  };
  E.sellValue = function (st, id) {
    var it = E.item(id, st);
    if (!it || it.custom || it.cat === 'lazer') return 0;
    if (it.price) return Math.max(1, Math.floor(it.price * 0.35));
    var byR = { comum: 20, incomum: 60, raro: 250, epico: 900, lendario: 3000, mitico: 6000, secreto: 4000 };
    return byR[it.rarity] || 10;
  };
  E.sell = function (id, qty) {
    var st = E.state;
    qty = qty || 1;
    var v = E.sellValue(st, id);
    if (!v) return { ok: false, msg: 'Este item não pode ser vendido.' };
    if (!E.removeItem(st, id, qty)) return { ok: false, msg: 'Não tens esse item.' };

    E.commit('venda');
    return { ok: true, coins: got };
  };
  E.addCustomLeisure = function (name, price, icon) {
    var st = E.state;
    name = String(name || '').trim();

    if (!(price >= 10 && price <= 100000)) return { ok: false, msg: 'Preço entre 10 e 100 000 moedas.' };
    var c = { id: uid('cl_'), name: name.slice(0, 40), price: price, icon: icon || '🎁' };

    return { ok: true, item: c };
  };
  E.removeCustomLeisure = function (id) {

  /* ---------------- equipamento ---------------- */
  E.equip = function (id, slotHint) {

    if (st.battle && !st.battle.over) return { ok: false, msg: 'Não podes trocar de equipamento a meio de uma batalha.' };
    if (E.count(st, id) < 1) return { ok: false, msg: 'Não tens este item.' };
    if (st.level < it.lvl) return { ok: false, msg: 'Precisas de nível ' + it.lvl + '.' };
    if (!E.canEquipClass(st, it)) return { ok: false, msg: 'A tua classe não pode usar isto.' };
    var slot = it.equip.slot;
    if (slot === 'acc') {
      if (slotHint === 'acc1' || slotHint === 'acc2') slot = slotHint;
      else slot = !st.equip.acc1 ? 'acc1' : (!st.equip.acc2 ? 'acc2' : 'acc1');
    }
    E.removeItem(st, id, 1);
    var old = st.equip[slot];
    if (old) E.addItem(st, old, 1);

  };
  E.unequip = function (slot) {

    if (st.battle && !st.battle.over) return { ok: false, msg: 'Não podes trocar de equipamento a meio de uma batalha.' };
    var id = st.equip[slot];
    if (!id) return { ok: false, msg: 'Nada equipado.' };

  /* ---------------- baús ---------------- */
  function pickWeighted(table) {
    var total = table.reduce(function (s, r) { return s + r[1]; }, 0);

  E.openChest = function (st, tier) {

    var per = E.totalStats(st).per;

    S.storage.clear();

/* ==========================================================
   MISSÕES: personalizadas + Missão Diária do Sistema
   - Concluir antes do horário de encerramento → XP, moedas e treino de atributos
   - Passar do horário sem concluir → penalidade (moedas e XP)
   - Ao abrir a app, os dias em falta (até 7) são verificados

(function (S) {
  'use strict';
  var E = S.engine;
  var M = S.missions = {};
  var CATCHUP_DAYS = 7;

  M.WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function today() { return E.dateKey(); }
  function now() { return S.clock.now(); }

  M.rewardFor = function (st, diff) {
    var d = S.DIFFICULTY[diff];
    var lm = S.levelMult(st.level);
    return { xp: Math.round(d.xp * lm), coins: Math.round(d.coins * lm), stat: d.stat };
  };

  M.validate = function (data, isEdit) {
    var t = String(data.title || '').trim();

    if (!S.DIFFICULTY[data.difficulty]) return 'Escolhe a dificuldade.';
    if (!E.validTime(data.deadline)) return 'Horário de encerramento inválido (usa HH:MM).';
    if (['once', 'daily', 'weekly'].indexOf(data.recur) < 0) return 'Escolhe a repetição.';
    if (!Array.isArray(data.stats) || data.stats.length > 3) return 'Escolhe até 3 atributos.';
    for (var i = 0; i < data.stats.length; i++) if (S.STATS.indexOf(data.stats[i]) < 0) return 'Atributo inválido.';
    if (data.recur === 'weekly' && (!Array.isArray(data.days) || !data.days.length)) return 'Escolhe pelo menos um dia da semana.';
    if (data.recur === 'once') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data.date))) return 'Escolhe a data.';
      if (!isEdit && E.deadlineTs(data.date, data.deadline) < now()) return 'Esse horário já passou. Escolhe uma hora ou data futura.';
    }
    return null;
  };

  function clean(data) {
    return {
      title: String(data.title).trim().slice(0, 60),
      desc: String(data.desc || '').trim().slice(0, 240),
      difficulty: data.difficulty,
      stats: data.stats.slice(0, 3),
      deadline: data.deadline,
      recur: data.recur,
      days: data.recur === 'weekly' ? data.days.map(Number).filter(function (d) { return d >= 0 && d <= 6; }) : [],
      date: data.recur === 'once' ? data.date : null
    };
  }

    var lines = (S.BOSS_LINES || {})[b.id];
    if (lines) log(st.battle, b.name + ': «' + lines[0] + '»', 'say');
    if (st.battle.gap <= -3) log(st.battle, '✨ Vantagem de nível: estás ' + (-st.battle.gap) + ' níveis acima do chefe (o teu dano +' + Math.round((C.pressure(st.battle.gap).playerDmg - 1) * 100) + '%, o dele -' + Math.round((1 - C.pressure(st.battle.gap).bossDmg) * 100) + '%).', 'good');
    if (st.battle.gap >= 3) log(st.battle, '⚠️ Pressão de nível: o chefe está ' + st.battle.gap + ' níveis acima de ti (o teu dano -' + Math.round((1 - C.pressure(st.battle.gap).playerDmg) * 100) + '%, o dele +' + Math.round((C.pressure(st.battle.gap).bossDmg - 1) * 100) + '%).', 'warn');
    E.commit('batalha iniciada');
    return { ok: true };
  };

  /* ---------------- dano do jogador ---------------- */
  function playerBase(bt, kind) {
    var ps = bt.p.stats;
    var atk = ps.atk * (1 + sum(bt.p.st, 'buff', 'atk') / 100);
    var matk = ps.matk * (1 + (sum(bt.p.st, 'buff', 'matk') + sum(bt.p.st, 'buff', 'atk') * 0.5) / 100);
    var def = ps.def * (1 + sum(bt.p.st, 'buff', 'def') / 100);
    var v;
    if (kind === 'mag') v = matk;
    else if (kind === 'def') v = def * 3;
    else if (kind === 'best') v = Math.max(atk, matk);
    else v = atk;
    if (ps.lowHpAtk && bt.p.hp < bt.p.maxHp * 0.3) v *= 1 + ps.lowHpAtk / 100;
    return v * C.pressure(bt.gap).playerDmg;
  }
  function damageBoss(bt, amount, label) {
    var b = bt.b;
    var dmg = Math.max(1, Math.round(amount));
    if (b.shield > 0) {
      var ab = Math.min(b.shield, dmg);
      b.shield -= ab;
      dmg -= ab;
      if (ab) log(bt, '🛡️ O escudo do chefe absorve ' + ab + '.', 'muted');
    }
    b.hp = Math.max(0, b.hp - dmg);
    return dmg;
  }
  function healPlayer(bt, amount) {
    var p = bt.p;
    var h = Math.max(0, Math.min(p.maxHp - p.hp, Math.round(amount)));
    p.hp += h;
    return h;
  }

  function doPlayerOp(bt, op, srcName) {
    var p = bt.p, b = bt.b, ps = p.stats;
    switch (op.op) {
      case 'dmg': {
        var hits = op.hits || 1;
        var base = playerBase(bt, op.kind === 'phys' || op.kind === 'mag' || op.kind === 'def' || op.kind === 'best' ? op.kind : ps.main);
        var total = 0, crits = 0;
        for (var i = 0; i < hits && b.hp > 0; i++) {
          var raw = base * op.mult * rnd(0.9, 1.1);
          var critChance = (ps.crit + sum(p.st, 'buff', 'crit') + (op.crit || 0)) / 100;
          var isCrit = op.alwaysCrit || chance(critChance);
          if (isCrit) { raw *= ps.critDmg / 100; crits++; }
          if (op.execute && b.hp < b.maxHp * op.execute.below) raw *= op.execute.mult;
          var effDef = Math.max(0, b.def * (1 - sum(b.st, 'debuff', 'def') / 100) * (1 - (op.pierce || 0)));
          var dmg = damageBoss(bt, raw * 100 / (100 + effDef));
          total += dmg;
          var ls = (ps.lifesteal + sum(p.st, 'buff', 'lifesteal')) / 100 + (op.lifesteal || 0);
          if (ls > 0) healPlayer(bt, dmg * ls);
        }
        log(bt, '➤ ' + srcName + ': ' + total + ' de dano' + (hits > 1 ? ' (' + hits + ' golpes)' : '') + (crits ? ' — CRÍTICO' + (crits > 1 ? ' ×' + crits : '') + '!' : '.'), crits ? 'crit' : 'dmg');
        break;
      }
      case 'dot': {
        var per = Math.round(Math.max(playerBase(bt, 'phys'), playerBase(bt, 'mag')) * op.mult * 0.6);
        addStatus(b.st, { kind: 'dot', type: op.type, val: per, turns: op.turns });
        log(bt, '☠️ O chefe sofre ' + C.DOT_NAMES[op.type] + ' (' + per + '/turno).', 'muted');
        break;
      }
      case 'stun': {
        var bossDef = S.BOSS_BY_ID[bt.bossId];
        var ch = op.chance * (bossDef.king ? 0.5 : 1);
        if (op.chance >= 1) ch = 1;
        if (b.stunImmune > 0 && op.chance < 1) { log(bt, '🌀 O chefe resiste ao atordoamento.', 'muted'); break; }
        if (chance(ch)) { b.stunned = Math.max(b.stunned, op.turns); b.stunImmune = op.turns + 2; log(bt, '💫 O chefe ficou atordoado!', 'good'); }
        else log(bt, '🌀 O atordoamento falhou.', 'muted');
        break;
      }
      case 'heal': {
        var h = healPlayer(bt, p.maxHp * op.pct / 100);
        log(bt, '💚 Recuperaste ' + h + ' de vida.', 'good');
        break;
      }
      case 'shield': {
        p.shield += Math.round(p.maxHp * op.pct / 100);
        log(bt, '🛡️ Escudo de ' + p.shield + '.', 'good');
        break;
      }
      case 'mp': {
        var m = Math.min(p.maxMp - p.mp, Math.round(p.maxMp * op.pct / 100));
        p.mp += m;
        log(bt, '💧 Recuperaste ' + m + ' de mana.', 'good');
        break;
      }
      case 'buff':
        addStatus(p.st, { kind: 'buff', key: op.key, val: op.val, turns: op.turns });
        log(bt, '⬆️ ' + C.BUFF_NAMES[op.key] + ' +' + op.val + '% (' + op.turns + ' turnos).', 'good');
        break;
      case 'debuff':
        addStatus(b.st, { kind: 'debuff', key: op.key, val: op.val, turns: op.turns });
        log(bt, '⬇️ ' + C.BUFF_NAMES[op.key] + ' do chefe -' + op.val + '%.', 'good');
        break;
      case 'summon': {
        var power = Math.round(Math.max(ps.matk, ps.atk) * op.mult * (1 + ps.summonPct / 100) * C.pressure(bt.gap).playerDmg);
        bt.summons = bt.summons.filter(function (x) { return x.name !== op.name; });
        bt.summons.push({ name: op.name, power: power, turns: op.turns });
        log(bt, '💀 ' + op.name + ' invocado (' + op.turns + ' turnos).', 'good');
        break;
      }
      case 'resetCd':
        p.cds = {};
        log(bt, '⏳ As tuas recargas foram reiniciadas.', 'good');
        break;
    }
  }

  /* ---------------- turno do chefe ---------------- */
  function bossAtk(bt) {
    var b = bt.b;
    var m = 1 + (sum(b.st, 'buff', 'atk') + b.bonusAtk - sum(b.st, 'debuff', 'atk')) / 100;
    return b.atk * Math.max(0.2, m) * C.pressure(bt.gap).bossDmg;
  }
  function damagePlayer(bt, amount) {
    var p = bt.p;
    var dmg = Math.max(1, Math.round(amount));
    if (p.shield > 0) {
      var ab = Math.min(p.shield, dmg);
      p.shield -= ab;
      dmg -= ab;
      if (ab) log(bt, '🛡️ O teu escudo absorve ' + ab + '.', 'muted');
    }
    p.hp = Math.max(0, p.hp - dmg);
    bt.took += dmg;
    return dmg;
  }
  function doBossOp(bt, op, name) {
    var p = bt.p, b = bt.b, ps = p.stats;
    switch (op.op) {
      case 'hit': {
        var hits = op.hits || 1, total = 0, dodged = 0;
        for (var i = 0; i < hits && p.hp > 0; i++) {
          var eva = (ps.eva + sum(p.st, 'buff', 'eva')) / 100;
          if (chance(Math.min(0.6, eva))) { dodged++; continue; }
          var raw = bossAtk(bt) * op.mult * rnd(0.9, 1.1);
          var def = Math.max(0, ps.def * (1 + (sum(p.st, 'buff', 'def') - sum(p.st, 'debuff', 'def')) / 100));
          var dmg = damagePlayer(bt, raw * 100 / (100 + def));
          total += dmg;
          var refl = sum(p.st, 'buff', 'reflect');
          if (refl > 0 && dmg > 0) damageBoss(bt, dmg * refl / 100);
          if (op.lifesteal) b.hp = Math.min(b.maxHp, b.hp + Math.round(dmg * op.lifesteal));
        }
        var txt = '◀ ' + name + ': ' + total + ' de dano';
        if (dodged) txt += hits > 1 ? ' (esquivaste ' + dodged + ')' : ' — ESQUIVASTE!';
        log(bt, txt + '.', dodged && !total ? 'good' : 'hurt');
        if (sum(p.st, 'buff', 'reflect') > 0 && total > 0) log(bt, '↩️ Devolveste dano ao chefe.', 'good');
        break;
      }
      case 'dot': {
        var per = Math.round(bossAtk(bt) * op.mult * 0.6);
        addStatus(p.st, { kind: 'dot', type: op.type, val: per, turns: op.turns });
        log(bt, '☠️ Sofres ' + C.DOT_NAMES[op.type] + ' (' + per + '/turno).', 'hurt');
        break;
      }
      case 'stun':
        if (p.stunImmune > 0) { log(bt, '🧠 Resististe ao atordoamento.', 'good'); break; }
        if (chance(op.chance)) { p.stunned = Math.max(p.stunned, op.turns); p.stunImmune = op.turns + 2; log(bt, '💫 Ficaste atordoado!', 'hurt'); }
        break;
      case 'heal': {
        var h = Math.min(b.maxHp - b.hp, Math.round(b.maxHp * op.pct / 100));
        b.hp += h;
        log(bt, '💚 O chefe regenera ' + h + ' de vida.', 'hurt');
        break;
      }
      case 'shield':
        b.shield += Math.round(b.maxHp * op.pct / 100);
        log(bt, '🛡️ O chefe cria um escudo de ' + b.shield + '.', 'hurt');
        break;
      case 'buff':
        addStatus(b.st, { kind: 'buff', key: op.key, val: op.val, turns: op.turns });
        log(bt, '🔥 O chefe fica enfurecido (+' + op.val + '% ataque).', 'hurt');
        break;
      case 'debuff':
        addStatus(p.st, { kind: 'debuff', key: op.key, val: op.val, turns: op.turns });
        log(bt, '⬇️ A tua defesa desce ' + op.val + '%.', 'hurt');
        break;
      case 'drainMp': {
        var d = Math.min(p.mp, Math.round(p.maxMp * op.pct / 100));
        p.mp -= d;
        log(bt, '💧 O chefe drena ' + d + ' de mana.', 'hurt');
        break;
      }
    }
  }
  function chooseBossSkill(bt, def) {
    var b = bt.b;
    var avail = def.skills.filter(function (k) { return S.BOSS_SKILLS[k] && !(b.cds[k] > 0); });
    var has = function (k) { return avail.indexOf(k) >= 0; };
    if (has('heal') && b.hp < b.maxHp * 0.5 && chance(0.7)) return 'heal';
    if (has('shield') && b.shield <= 0 && chance(0.35)) return 'shield';
    if (has('enrage') && sum(b.st, 'buff', 'atk') === 0 && chance(0.45)) return 'enrage';
    var attacks = avail.filter(function (k) { return ['heal', 'shield', 'enrage'].indexOf(k) < 0; });
    if (!attacks.length) return 'strike';
    var weighted = [];
    attacks.forEach(function (k) { var w = k === 'strike' ? 1 : (k === 'apocalypse' || k === 'ult' ? 1 : 2); for (var i = 0; i < w; i++) weighted.push(k); });
    return weighted[Math.floor(S.rng.random() * weighted.length)];
  }
  function bossTurn(bt) {
    var b = bt.b;
    var def = S.BOSS_BY_ID[bt.bossId];
    if (b.stunned > 0) {
      b.stunned--;
      log(bt, '💫 ' + def.name + ' está atordoado e perde o turno.', 'good');
      return;
    }
    var k = chooseBossSkill(bt, def);
    var sk = S.BOSS_SKILLS[k];
    if (sk.cd) b.cds[k] = sk.cd + 1;
    sk.ops.forEach(function (op) { if (bt.p.hp > 0) doBossOp(bt, op, sk.name); });
  }
  function checkPhases(bt) {
    var b = bt.b;
    var def = S.BOSS_BY_ID[bt.bossId];
    if (!def.king || b.hp <= 0) return;
    if (bt.phase === 1 && b.hp <= b.maxHp * 0.5) {
      bt.phase = 2;
      b.bonusAtk += 20;
      log(bt, '⚠️ ' + def.name + ' entra na FASE 2: ataque +20%!', 'warn');
    }
    if (def.special === 'final' && bt.phase === 2 && b.hp <= b.maxHp * 0.25) {
      bt.phase = 3;
      b.bonusAtk += 20;
      var h = Math.round(b.maxHp * 0.15);
      b.hp = Math.min(b.maxHp, b.hp + h);
      log(bt, '⚠️ FASE FINAL! ' + def.name + ' liberta todo o seu poder e recupera ' + h + ' de vida!', 'warn');
    }
  }

  function tickDots(bt, list, isBoss) {
    var total = 0;
    list.forEach(function (s) { if (s.kind === 'dot') total += s.val; });
    if (!total) return;
    if (isBoss) { var d = damageBoss(bt, total); log(bt, '☠️ Efeitos causam ' + d + ' ao chefe.', 'dmg'); }
    else { var d2 = damagePlayer(bt, total); log(bt, '☠️ Efeitos causam-te ' + d2 + ' de dano.', 'hurt'); }
  }
  function endRound(bt) {
    [bt.p.st, bt.b.st].forEach(function (list) {
      for (var i = list.length - 1; i >= 0; i--) { list[i].turns--; if (list[i].turns <= 0) list.splice(i, 1); }
    });
    [bt.p.cds, bt.b.cds].forEach(function (cds) { Object.keys(cds).forEach(function (k) { cds[k]--; if (cds[k] <= 0) delete cds[k]; }); });
    if (bt.p.stunImmune > 0) bt.p.stunImmune--;
    if (bt.b.stunImmune > 0) bt.b.stunImmune--;
    bt.summons = bt.summons.filter(function (s) { s.turns--; return s.turns > 0; });
    var p = bt.p;
    if (p.hp > 0) {
      var mpg = Math.round(p.maxMp * p.stats.regenMp / 100);
      p.mp = Math.min(p.maxMp, p.mp + mpg);
      if (p.stats.regenHp) healPlayer(bt, p.maxHp * p.stats.regenHp / 100);
    }
    bt.turn++;
    // batalhas demasiado longas: o portão começa a colapsar e o chefe fica mais forte
    if (bt.turn > 40 && bt.turn % 5 === 0) {
      bt.b.bonusAtk += 15;
      log(bt, '⏳ O portão está a colapsar! O chefe fica mais forte (+15% ataque).', 'warn');
    }
  }

  function tryRevive(st, bt) {
    var p = bt.p;
    if (p.hp > 0) return;
    if (p.stats.lastStand && !p.lastStandUsed) { p.lastStandUsed = true; p.hp = 1; log(bt, '🔥 Vontade Inabalável! Sobreviveste com 1 de vida.', 'warn'); return; }
    if (p.stats.revive && !p.reviveUsed) { p.reviveUsed = true; p.hp = Math.round(p.maxHp * p.stats.revive / 100); log(bt, '🔥 Renasceste das cinzas com ' + p.hp + ' de vida!', 'warn'); return; }
    if (E.removeItem(st, 'sx_fenix', 1)) { p.hp = Math.round(p.maxHp * 0.5); log(bt, '🪶 A Pena da Fénix arde e devolve-te à vida!', 'warn'); }
  }

  function finishWin(st, bt) {
    var def = S.BOSS_BY_ID[bt.bossId];
    var r = C.rewards(st, def);
    bt.over = 'win';
    st.defeated[def.id] = now();
    var trophy = S.TROPHIES[def.id];
    if (trophy && !st.trophies[def.id]) st.trophies[def.id] = now();
    var levelBefore = st.level;
    var xp = E.gainXp(st, r.xp);
    var coins = E.gainCoins(st, r.coins);
    var items = ['bau_' + r.chest];
    E.addItem(st, 'bau_' + r.chest, 1);
    if (r.special) (r.special.items || []).forEach(function (id) { E.addItem(st, id, 1); items.push(id); });
    // drop raro aleatório
    if (chance(0.04 + def.level / 2500)) { var sx = ['sx_moeda', 'sx_fenix', 'sx_fragmento'][Math.floor(S.rng.random() * 3)]; E.addItem(st, sx, 1); items.push(sx); }
    E.bump(st, 'bossesKilled');
    E.bump(st, 'battlesWon');
    if (def.level >= levelBefore + 5) E.bump(st, 'giantKills');
    if (bt.p.hp < bt.p.maxHp * 0.1) E.bump(st, 'lowHpWins');
    if (bt.took === 0 && def.level >= 10) E.bump(st, 'flawlessWins');
    bt.result = { xp: xp, coins: coins, items: items, trophy: trophy ? trophy.name : null };
    var last = ((S.BOSS_LINES || {})[def.id] || [])[1] || null;
    if (last) { log(bt, def.name + ': «' + last + '»', 'say'); bt.result.lastWords = last; }
    log(bt, '🏆 VITÓRIA! ' + def.name + ' foi derrotado para sempre.', 'win');
    E.emit({ type: 'victory', title: 'VITÓRIA', name: def.name, lastWords: last, trophy: trophy ? trophy.name : null, lines: ['+' + xp + ' XP', '+' + coins + ' moedas'].concat(items.map(function (id) { return '+1 ' + S.ITEMS[id].name; })) });
    if (trophy) {
      var g = def.gate, set = E.gateTrophies(st, g);
      if (set.have === set.total) {
        var sd = S.TROPHY_SETS[g];
        E.emit({ type: 'info', title: 'CONJUNTO DE TROFÉUS COMPLETO', name: g === 0 ? 'Portões Ocultos' : S.GATES[g - 1].name, lines: ['Bónus permanente: ' + sd.desc] });
        E.history(st, '🏆', 'Completou os troféus de ' + (g === 0 ? 'Portões Ocultos' : S.GATES[g - 1].name) + ': ' + sd.desc + '.');
      }
    }
    if (r.special && r.special.skill) E.grantSkill(st, r.special.skill);
    E.history(st, '🏆', 'Derrotou ' + def.name + ' (Nv. ' + def.level + '): +' + xp + ' XP, +' + coins + ' moedas.');
  }
  function finishLose(st, bt) {
    var def = S.BOSS_BY_ID[bt.bossId];
    bt.over = 'lose';
    E.bump(st, 'battlesLost');
    var lv = E.loseLevel(st);
    // o Sistema reanima-te com 10% da vida
    E.setHp(st, E.combatStats(st).maxHp * C.REVIVE_PCT / 100);
    bt.result = { level: lv.to, levelFrom: lv.from };
    var lines = lv.to < lv.from
      ? ['Morreste: desceste do nível ' + lv.from + ' para o nível ' + lv.to + '.', 'Perdeste o XP do nível e ' + S.POINTS_PER_LEVEL + ' pontos de atributo.']
      : ['Morreste no nível 1: perdeste o XP acumulado.'];
    lines.push('O Sistema reanimou-te com ' + C.REVIVE_PCT + '% da vida. Bebe poções para recuperar.');
    log(bt, '💀 MORRESTE. ' + (lv.to < lv.from ? 'Desceste para o nível ' + lv.to + '.' : 'Perdeste o XP do nível.'), 'lose');
    E.emit({ type: 'defeat', title: 'MORRESTE', name: def.name, lines: lines });
    E.history(st, '💀', 'Morreu contra ' + def.name + (lv.to < lv.from ? ': desceu do nível ' + lv.from + ' para o ' + lv.to + '.' : '.'));
  }

  C.REVIVE_PCT = 10;

  C.unlockedActiveSkills = function (st) {
    return E.unlockedSkills(st).filter(function (s) { return s.type === 'active'; });
  };

  /* Ação do jogador: {type:'attack'|'skill'|'item'|'defend'|'flee'|'pass', id} */
  /* No fim da batalha (vitória ou fuga) a vida com que ficaste é guardada */
  C.act = function (type, id) {
    var res = actInner(type, id);
    var st = E.state, bt = st && st.battle;
    if (bt && bt.over && bt.over !== 'lose' && !bt.hpSaved) {
      bt.hpSaved = true;
      E.setHp(st, bt.p.hp);
      E.commit('vida');
    }
    return res;
  };
  function actInner(type, id) {
    var st = E.state;
    var bt = st.battle;
    if (!bt) return { ok: false, msg: 'Não estás em batalha.' };
    if (bt.over) return { ok: false, msg: 'A batalha terminou.' };
    var p = bt.p;
    if (p.stunned > 0 && type !== 'pass' && type !== 'flee') return { ok: false, msg: 'Estás atordoado.' };
    if (type === 'pass' && !(p.stunned > 0)) return { ok: false, msg: 'Ação inválida.' };

    switch (type) {
      case 'attack':
        doPlayerOp(bt, { op: 'dmg', kind: p.stats.main, mult: 1 }, 'Ataque');
        break;
      case 'skill': {
        var sk = S.ALL_SKILLS[id];
        var known = C.unlockedActiveSkills(st).some(function (s) { return s.id === id; });
        if (!sk || !known) return { ok: false, msg: 'Habilidade indisponível.' };
        if (p.cds[id] > 0) return { ok: false, msg: 'Em recarga (' + p.cds[id] + ' turnos).' };
        if (p.mp < sk.mp) return { ok: false, msg: 'Mana insuficiente.' };
        p.mp -= sk.mp;
        if (sk.cd) p.cds[id] = sk.cd + 1;
        log(bt, '✦ Usaste ' + sk.name + '.', 'skill');
        sk.ops.forEach(function (op) { if (bt.b.hp > 0 || op.op !== 'dmg') doPlayerOp(bt, op, sk.name); });
        break;
      }
      case 'item': {
        var it = S.ITEMS[id];
        if (!it || !it.battle) return { ok: false, msg: 'Este item não se usa em combate.' };
        if (E.count(st, id) < 1) return { ok: false, msg: 'Não tens este item.' };
        if (!S.time.itemActive(it)) return { ok: false, msg: 'Este item só funciona ' + S.time.PHASES[it.phase].desc + '.' };
        var isHeal = it.use.type === 'heal' || it.use.type === 'restore';
        if (isHeal && (bt.healsUsed || 0) >= C.HEAL_LIMIT) return { ok: false, msg: 'Já usaste ' + C.HEAL_LIMIT + ' poções de cura nesta batalha. O corpo não aguenta mais.' };
        if (isHeal) bt.healsUsed = (bt.healsUsed || 0) + 1;
        E.removeItem(st, id, 1);
        E.bump(st, 'consumablesUsed');
        var u = it.use;
        log(bt, '🎒 Usaste ' + it.name + '.', 'skill');
        if (u.type === 'heal') doPlayerOp(bt, { op: 'heal', pct: u.pct });
        else if (u.type === 'mana') doPlayerOp(bt, { op: 'mp', pct: u.pct });

  function missionsHtml(st) {

      var dr = M.dailyReward(st);
      h += '<section class="win' + (ds === 'done' ? '' : ' gold') + '" id="daily-win"><div class="win-h">Missão diária <small>Sequência ' + st.daily.streak + '</small></div>' +
        '<div class="row between" style="margin-bottom:10px"><div><h3 style="font-size:17px">Treino do Sistema</h3>' +

  function diffBadge(d) { var D = S.DIFFICULTY[d]; return '<span class="diff" style="color:' + D.color + '" title="' + D.name + '">' + D.id + '</span>'; }
  function missionCard(st, x) {
    var m = x.m, r = M.rewardFor(st, m.difficulty);
