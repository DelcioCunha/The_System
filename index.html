<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060a14">
<title>Sistema</title>
<meta name="description" content="Sistema: um RPG da vida real. Criado por Delcio Cunha.">
<meta name="author" content="Delcio Cunha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/web/favicon.png">
<link rel="apple-touch-icon" href="assets/web/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
/* Layout: coluna única de telemóvel (máx. 520px), janelas do "Sistema" empilhadas, barra de navegação fixa em baixo.
   Visual: janelas holográficas azul-gelo sobre um vazio azul-noite; dourado reservado a rank, moedas e recompensas. */
:root {
  --void: #060a14;
  --void-2: #0a1122;
  --panel: rgba(13, 24, 46, 0.86);
  --panel-solid: #0d182e;
  --line: #1d3358;
  --line-hi: #3a78b8;
  --glow: #6fd6ff;
  --glow-soft: rgba(111, 214, 255, 0.16);
  --text: #dce8ff;
  --muted: #8396ba;
  --faint: #4d5f82;
  --gold: #ffc85a;
  --danger: #ff5a6e;
  --good: #5be08a;
  --warn: #ffb02e;
  --violet: #a184ff;
  --f-display: 'Oxanium', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Barlow', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --r: 4px;
  --nav-h: 64px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(64, 140, 255, 0.14), transparent 60%),
    radial-gradient(800px 500px at 100% 110%, rgba(140, 90, 255, 0.10), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}

/* ---------- topo ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) 0;
  background: linear-gradient(var(--void) 70%, rgba(6, 10, 20, 0));
}
.top-row { display: flex; align-items: center; gap: 10px; }
.top-lv { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; color: var(--glow); text-transform: uppercase; }
.top-name { font-family: var(--f-display); font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coins { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--gold); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.coin-ico { width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--gold); display: inline-block; box-shadow: 0 0 8px rgba(255, 200, 90, .5); }
.top-xp { height: 3px; background: var(--line); margin-top: 8px; position: relative; overflow: hidden; }
.top-xp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--glow), #b9ecff); box-shadow: 0 0 10px var(--glow); }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); flex: none; }
.save-dot.err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

/* ---------- janelas do sistema ---------- */
.win {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line-hi);
  box-shadow: 0 0 0 1px rgba(111, 214, 255, .06) inset, 0 0 24px rgba(60, 150, 255, .10);
  padding: 14px;
  margin-top: 14px;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.win::before, .win::after {
  content: ''; position: absolute; width: 14px; height: 14px; border-color: var(--glow); border-style: solid; pointer-events: none;
}
.win::before { top: 4px; left: 4px; border-width: 1px 0 0 1px; }
.win::after { bottom: 4px; right: 4px; border-width: 0 1px 1px 0; }
.win-h {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--f-display); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--glow);
  margin: -2px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.win-h small { letter-spacing: .06em; color: var(--muted); font-family: var(--f-mono); font-size: 11px; text-transform: none; }
.win.danger { border-color: rgba(255, 90, 110, .6); }
.win.danger .win-h { color: var(--danger); }
.win.gold { border-color: rgba(255, 200, 90, .55); }
.win.gold .win-h { color: var(--gold); }

h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }
.between { justify-content: space-between; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: var(--r);
  border: 1px solid var(--line-hi); background: rgba(58, 120, 184, .12);
  font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
  transition: background .15s, border-color .15s, transform .08s;
}
.btn:hover { background: rgba(111, 214, 255, .16); border-color: var(--glow); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.pri { background: linear-gradient(180deg, rgba(111, 214, 255, .32), rgba(111, 214, 255, .14)); border-color: var(--glow); color: #f2fbff; box-shadow: 0 0 14px rgba(111, 214, 255, .25); }
.btn.gold { border-color: var(--gold); color: var(--gold); background: rgba(255, 200, 90, .10); }
.btn.bad { border-color: rgba(255, 90, 110, .7); color: #ffc2ca; background: rgba(255, 90, 110, .10); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 12px; }
.btn.block { width: 100%; }
.btn.icon { width: 36px; min-height: 36px; padding: 0; font-size: 18px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 12px; font-size: 13px; color: var(--muted); white-space: nowrap;
}
.chip.on { border-color: var(--glow); color: var(--text); background: var(--glow-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.rank {
  display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 5px;
  font-family: var(--f-display); font-weight: 800; font-size: 13px; border: 1.5px solid currentColor; border-radius: 3px;
}

/* ---------- barras ---------- */
.bar { height: 10px; background: rgba(29, 51, 88, .7); position: relative; overflow: hidden; border-radius: 2px; }
.bar > i { position: absolute; inset: 0 auto 0 0; transition: width .35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ff4d63, #ff8a7a); }
.bar.mp > i { background: linear-gradient(90deg, #3d7dff, #6fd6ff); }
.bar.xp > i { background: linear-gradient(90deg, var(--glow), #c7f1ff); box-shadow: 0 0 10px var(--glow); }
.bar.boss > i { background: linear-gradient(90deg, #b3132f, #ff5a6e); }
.bar .sh { position: absolute; inset: 0 auto 0 0; background: rgba(220, 232, 255, .55); }
.bar-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- navegação ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
  background: rgba(6, 10, 20, .94); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button {
  background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 3px;
  color: var(--faint); font-family: var(--f-display); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; position: relative;
}
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.nav button.on { color: var(--glow); }
.nav button.on::before { content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.nav .badge { position: absolute; top: 8px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-family: var(--f-mono); }

/* ---------- estado / avatar ---------- */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; }
@media (max-width: 360px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.avatar { width: 132px; aspect-ratio: 3 / 4; max-width: 100%; position: relative; overflow: hidden; border: 1px solid var(--line-hi); background: #050912; }
.avatar img, .avatar svg { width: 100%; height: 100%; display: block; object-fit: cover; }
.avatar.sm { width: 44px; }
.hero-name { font-size: 24px; font-weight: 700; line-height: 1.1; }
.hero-title { font-family: var(--f-display); color: var(--gold); font-size: 14px; letter-spacing: .04em; margin-top: 4px; }
.lv-big { font-family: var(--f-display); font-size: 44px; font-weight: 800; line-height: 1; color: #f2fbff; text-shadow: 0 0 18px rgba(111, 214, 255, .6); }
.lv-lab { font-family: var(--f-display); font-size: 11px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.kv b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }

.stat { display: grid; grid-template-columns: 40px 1fr auto 40px; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(29, 51, 88, .6); }
.stat:last-child { border-bottom: 0; }
.stat-k { font-family: var(--f-display); font-weight: 700; color: var(--glow); letter-spacing: .08em; }
.stat-v { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.stat-n { font-size: 13px; }
.stat-n small { display: block; color: var(--muted); font-size: 11.5px; }
.points { color: var(--gold); font-family: var(--f-display); letter-spacing: .08em; }

.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.menu-grid .btn { justify-content: space-between; min-height: 48px; text-transform: none; letter-spacing: .02em; font-size: 14px; }

/* ---------- listas / cartões ---------- */
.list { display: grid; gap: 8px; }
.card {
  border: 1px solid var(--line); background: rgba(10, 17, 34, .75); padding: 12px; border-radius: var(--r);
  display: grid; gap: 8px; position: relative;
}
.card.tap { cursor: pointer; text-align: left; width: 100%; }
.card.tap:hover { border-color: var(--line-hi); }
.card.done { opacity: .62; }
.card.failed { border-color: rgba(255, 90, 110, .45); }
.card-h { display: flex; align-items: flex-start; gap: 10px; }
.card-t { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.diff { flex: none; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; border: 1.5px solid currentColor; border-radius: 3px; }
.ico { flex: none; width: 42px; height: 42px; display: grid; place-items: center; font-size: 24px; border: 1px solid var(--line); background: rgba(6, 10, 20, .6); border-radius: var(--r); }
.ico.big { width: 64px; height: 64px; font-size: 36px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.reward { color: var(--gold); font-family: var(--f-mono); font-size: 12.5px; }
.cd { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.cd.urgent { color: var(--warn); }
.stamp { font-family: var(--f-display); font-size: 11px; letter-spacing: .18em; padding: 2px 6px; border: 1px solid currentColor; text-transform: uppercase; }
.stamp.ok { color: var(--good); }
.stamp.no { color: var(--danger); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; border: 1px dashed var(--line); border-radius: var(--r); }

.task { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.task .bar { grid-column: 1 / -1; height: 6px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); }
.stepper button { width: 34px; height: 32px; background: none; border: 0; font-size: 18px; color: var(--glow); }
.stepper input { width: 64px; text-align: center; background: transparent; border: 0; border-inline: 1px solid var(--line); height: 32px; font-family: var(--f-mono); }

/* ---------- formulários ---------- */
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
input.in, textarea.in, select.in {
  width: 100%; background: rgba(6, 10, 20, .7); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 12px; color: var(--text); font-size: 15px;
}
input.in:focus, textarea.in:focus, select.in:focus { border-color: var(--glow); outline: none; box-shadow: 0 0 0 3px var(--glow-soft); }
textarea.in { resize: vertical; min-height: 70px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; min-width: 44px; padding: 8px 6px; border: 1px solid var(--line); background: transparent; border-radius: var(--r); color: var(--muted); font-size: 13px; }
.seg button.on { border-color: var(--glow); color: var(--text); background: var(--glow-soft); }
.seg.diffs button { font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.hint { font-size: 12px; color: var(--muted); }

/* ---------- modais ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(2, 4, 10, .78); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
@media (min-width: 560px) { .overlay { align-items: center; } }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto;
  background: var(--panel-solid); border: 1px solid var(--line-hi); border-bottom: 0;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@media (min-width: 560px) { .sheet { border-bottom: 1px solid var(--line-hi); } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sheet-h h2 { font-size: 18px; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

/* janela de notificação do sistema */
.sys-pop { align-items: center; }
.sys-box {
  width: min(92%, 400px); background: var(--panel-solid); border: 1px solid var(--glow);
  box-shadow: 0 0 40px rgba(111, 214, 255, .35), 0 0 0 1px rgba(111, 214, 255, .15) inset;
  padding: 18px; text-align: center; animation: pop .28s cubic-bezier(.2, 1.4, .4, 1);
}
.sys-box.bad { border-color: var(--danger); box-shadow: 0 0 40px rgba(255, 90, 110, .3); }
.sys-box.gold { border-color: var(--gold); box-shadow: 0 0 40px rgba(255, 200, 90, .3); }
.sys-tag { display: inline-block; font-family: var(--f-display); font-size: 11px; letter-spacing: .3em; color: var(--glow); border: 1px solid var(--line-hi); padding: 3px 10px; margin-bottom: 10px; }
.sys-box h2 { font-size: 22px; letter-spacing: .06em; }
.sys-box .big { font-family: var(--f-display); font-size: 56px; font-weight: 800; line-height: 1; margin: 6px 0; color: #f2fbff; text-shadow: 0 0 22px var(--glow); }
.sys-lines { list-style: none; padding: 0; margin: 12px 0 16px; display: grid; gap: 4px; font-family: var(--f-mono); font-size: 13.5px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 60; background: var(--panel-solid); border: 1px solid var(--line-hi); padding: 10px 16px; border-radius: var(--r);
  font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0, 0, 0, .5); animation: up .2s ease-out;
}
.toast.bad { border-color: var(--danger); }

/* ---------- combate ---------- */
.battle { padding-top: 10px; }
.boss-panel { text-align: center; }
.boss-ico { font-size: 64px; line-height: 1; display: inline-block; filter: drop-shadow(0 0 18px rgba(255, 90, 110, .45)); }
.boss-ico.hit { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-8px) rotate(-4deg); } 40% { transform: translateX(7px) rotate(3deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.statuses { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 20px; }
.statuses .tag.good { border-color: rgba(91, 224, 138, .5); color: var(--good); }
.statuses .tag.bad { border-color: rgba(255, 90, 110, .5); color: #ff9aa6; }
.log {
  height: 180px; overflow-y: auto; font-size: 13px; display: grid; align-content: start; gap: 3px;
  background: rgba(4, 7, 14, .7); border: 1px solid var(--line); padding: 8px 10px; font-family: var(--f-body);
}
.log .crit { color: var(--gold); font-weight: 600; }
.log .dmg { color: #e7f1ff; }
.log .hurt { color: #ff9aa6; }
.log .good { color: var(--good); }
.log .warn { color: var(--warn); font-weight: 600; }
.log .skill { color: var(--glow); }
.log .lore { color: var(--muted); font-style: italic; }
.log .win { color: var(--gold); font-weight: 700; }
.log .lose { color: var(--danger); font-weight: 700; }
.log .sys, .log .muted { color: var(--muted); }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.actions .btn { min-height: 48px; }
.skill-grid { display: grid; gap: 8px; }
.skill-btn { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line-hi); background: rgba(58, 120, 184, .1); border-radius: var(--r); }
.skill-btn[disabled] { opacity: .4; }
.skill-btn b { font-family: var(--f-display); letter-spacing: .03em; }
.skill-btn small { color: var(--muted); grid-column: 1 / -1; font-size: 12px; }
.danger-l { font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.defeated { position: absolute; right: 10px; top: 10px; transform: rotate(8deg); }

/* ---------- arranque ---------- */
.intro { min-height: 100%; display: grid; align-content: center; gap: 18px; padding-block: 40px; }
.intro .win { margin: 0; }
.type { font-family: var(--f-mono); font-size: 14px; line-height: 1.7; white-space: pre-wrap; min-height: 6em; }
.class-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.class-card { text-align: left; border: 1px solid var(--line); background: rgba(10, 17, 34, .8); padding: 10px; border-radius: var(--r); display: grid; gap: 6px; }
.class-card.on { border-color: var(--glow); box-shadow: 0 0 0 1px var(--glow) inset, 0 0 18px rgba(111, 214, 255, .2); }
.class-card .nm { font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.minibars { display: grid; gap: 3px; }
.minibars div { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; font-size: 10px; color: var(--muted); font-family: var(--f-mono); }
.minibars span { height: 4px; background: var(--line); position: relative; }
.minibars span i { position: absolute; inset: 0 auto 0 0; background: var(--glow); }


/* ===== Fichas detalhadas: narrativa e propriedades ===== */
.info-tap { display: inline-flex; cursor: pointer; position: relative; border-radius: var(--r); -webkit-tap-highlight-color: transparent; }
.info-tap::after { content: 'i'; position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--panel-solid); border: 1px solid var(--line-hi); color: var(--glow); font: 700 9px/12px var(--f-mono); text-align: center; pointer-events: none; }
.info-tap:active { transform: scale(.94); }
.lore { font-style: italic; color: #b9c8e6; font-size: 14px; line-height: 1.55; margin: 12px 0 0; padding: 10px 12px;
  border-left: 2px solid var(--line-hi); background: linear-gradient(90deg, var(--glow-soft), transparent 80%); border-radius: 0 var(--r) var(--r) 0; }
.lore.boss-lore { margin-top: 6px; }
.chronicle { margin-top: 12px; }
.gate-lore { margin-top: 8px; }
.gate-lore summary { cursor: pointer; color: var(--glow); font-size: 13px; list-style: none; }
.gate-lore summary::before { content: '▸ '; }
.gate-lore[open] summary::before { content: '▾ '; }
.info-secs { display: grid; gap: 10px; margin-top: 14px; }
.info-sec { border: 1px solid var(--line); background: rgba(6, 12, 26, .55); border-radius: var(--r); padding: 10px 12px; }
.info-h { font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--glow); margin-bottom: 8px; }
.info-r { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px dashed rgba(58, 120, 184, .22); font-size: 13px; }
.info-r:first-of-type { border-top: 0; }
.info-r span { color: var(--muted); flex: 0 0 auto; max-width: 48%; }
.info-r b { font-weight: 600; text-align: right; color: var(--text); }
.info-r.col { flex-direction: column; gap: 2px; }
.info-r.col span { color: var(--text); font-weight: 600; max-width: none; }
.info-r.col b { text-align: left; font-weight: 400; color: var(--muted); }
.info-hero { display: flex; gap: 12px; align-items: flex-start; }
.info-img { border: 1px solid var(--rc, var(--line-hi)); border-radius: 6px; overflow: hidden; background: var(--void);
  box-shadow: 0 0 24px -6px var(--rc, var(--glow)); animation: infoIn .45s cubic-bezier(.2, .9, .3, 1.2) both; }
.info-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.info-img.skill { width: 96px; height: 96px; flex: 0 0 96px; }
.info-img.item-big, .info-img.trophy-big { width: 168px; height: 168px; margin: 0 auto 12px; }
@keyframes infoIn { from { opacity: 0; transform: scale(.85) rotate(-2deg); } to { opacity: 1; transform: none; } }
button.trophy { font: inherit; color: inherit; padding: 0; cursor: pointer; appearance: none; -webkit-appearance: none; }
@media (prefers-reduced-motion: reduce) { .info-img { animation: none; } }

/* ===== Créditos ===== */
.made-by { text-align: center; color: var(--faint); font-size: 12px; letter-spacing: .08em; margin-top: 18px; }
.made-by b { color: var(--muted); font-weight: 600; }
.credits-btn { grid-column: 1 / -1; border-color: rgba(255, 200, 90, .35); color: var(--gold); }
.credits { text-align: center; overflow: hidden; }
.credits > div, .cr-role, .cr-link { animation: crIn .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
@keyframes crIn { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.cr-top { padding: 8px 0 14px; border-bottom: 1px solid var(--line); }
.cr-game { font: 800 34px/1 var(--f-display); letter-spacing: .32em; text-indent: .32em; color: var(--glow); text-shadow: 0 0 22px rgba(111, 214, 255, .55); }
.cr-tag { color: var(--muted); font-size: 13px; margin-top: 8px; }
.cr-creator { padding: 18px 0; border-bottom: 1px solid var(--line); }
.cr-label, .cr-area { font: 600 11px/1 var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
.cr-name { font: 700 28px/1.1 var(--f-display); letter-spacing: .06em; margin-top: 8px;
  background: linear-gradient(90deg, var(--gold), #fff3cf, var(--gold)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: crShine 4s linear infinite; }
@keyframes crShine { to { background-position: -200% 0; } }
.cr-note { color: var(--muted); font-size: 13px; margin-top: 10px; }
.cr-roles { display: grid; gap: 14px; padding-top: 16px; }
.cr-who { font: 600 16px/1.2 var(--f-display); color: var(--text); margin-top: 5px; }
.cr-what { color: var(--muted); font-size: 12px; margin-top: 3px; }
.cr-links { display: grid; gap: 8px; }
.cr-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r);
  background: rgba(6, 12, 26, .55); color: var(--text); text-decoration: none; }
.cr-link:active, .cr-link:hover { border-color: var(--line-hi); background: var(--glow-soft); }
.cr-link b { display: block; font-weight: 600; }
.cr-link small { display: block; color: var(--muted); font-size: 12px; }
.cr-ico { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 8px; font: 700 15px/1 var(--f-display); color: #fff; }
.cr-portfolio { background: linear-gradient(135deg, #2b6cb0, #6fd6ff); }
.cr-instagram { background: linear-gradient(135deg, #f9a03f, #e1306c 55%, #7b3fe4); }
.cr-facebook { background: #1f5fd1; }
.cr-x { background: #000; border: 1px solid #333; }
.cr-linkedin { background: #0a66c2; }
.cr-go { color: var(--glow); font-size: 16px; }
.cr-end { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; margin: 18px 0 8px; }
.cr-end .mono { color: var(--faint); font-size: 11px; }
@media (prefers-reduced-motion: reduce) { .credits > div, .cr-role, .cr-link { animation: none; } .cr-name { animation: none; } }

/* ==========================================================
   ANIMAÇÕES E EFEITOS
   ========================================================== */
#app { position: relative; z-index: 1; }
#bg-fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 72; pointer-events: none; }
#fx-layer { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
#fx-layer > * { position: absolute; }

/* vinheta e linhas de varrimento discretas sobre todo o ecrã */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0, 0, 0, .55) 100%),
    repeating-linear-gradient(0deg, rgba(111, 214, 255, .025) 0 1px, transparent 1px 3px);
}
.battle-mode body::after, body.battle-mode::after {
  background:
    radial-gradient(ellipse at 50% 30%, transparent 45%, rgba(40, 0, 10, .7) 100%),
    repeating-linear-gradient(0deg, rgba(255, 90, 110, .03) 0 1px, transparent 1px 3px);
}

/* ---------------- abertura das janelas do Sistema ---------------- */
@keyframes winOpen {
  0% { transform: scale(.04, .015); opacity: 0; filter: brightness(3); }
  30% { transform: scale(1, .015); opacity: 1; filter: brightness(2.5); }
  65% { transform: scale(1, 1.03); filter: brightness(1.3); }
  100% { transform: none; filter: none; }
}
@keyframes glitchText {
  0% { opacity: 0; transform: translateX(-6px); clip-path: inset(0 0 60% 0); }
  20% { opacity: 1; transform: translateX(4px); clip-path: inset(40% 0 0 0); text-shadow: -2px 0 #ff3d7f, 2px 0 var(--glow); }
  40% { transform: translateX(-2px); clip-path: inset(0 0 20% 0); }
  60% { transform: translateX(1px); clip-path: inset(10% 0 30% 0); text-shadow: 1px 0 #ff3d7f, -1px 0 var(--glow); }
  100% { opacity: 1; transform: none; clip-path: inset(0); text-shadow: none; }
}
@keyframes scanSweep { from { transform: translateY(-100%); } to { transform: translateY(2000%); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.fx-full .enter .win { animation: winOpen .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); transform-origin: 50% 50%; }
.fx-full .enter .win-h { animation: glitchText .45s steps(1, end) both; animation-delay: calc(var(--i, 0) * 70ms + 260ms); }
.fx-full .enter .win > :not(.win-h):not(.scanline) { animation: fadeIn .4s ease both; animation-delay: calc(var(--i, 0) * 70ms + 300ms); }
.fx-full .enter .card, .fx-full .enter .stat, .fx-full .enter .chips > * { animation: fadeUp .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + var(--j, 0) * 45ms + 320ms); }
.fx-reduced .enter .win { animation: fadeIn .25s ease both; }
.scanline { position: absolute; left: 0; right: 0; top: 0; height: 18%; pointer-events: none; z-index: 3;
  background: linear-gradient(180deg, transparent, rgba(111, 214, 255, .22), transparent); animation: scanSweep 1.1s ease-in both; }

/* janelas vivas: brilho que percorre a borda */
@keyframes borderPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(111, 214, 255, .06) inset, 0 0 22px rgba(60, 150, 255, .10); } 50% { box-shadow: 0 0 0 1px rgba(111, 214, 255, .16) inset, 0 0 34px rgba(60, 150, 255, .22); } }
.fx-full .win { animation: borderPulse 5s ease-in-out infinite; }
.fx-full .win.gold { animation-name: borderPulseGold; }
@keyframes borderPulseGold { 0%, 100% { box-shadow: 0 0 20px rgba(255, 200, 90, .08); } 50% { box-shadow: 0 0 34px rgba(255, 200, 90, .25); } }
.fx-full .enter .win { animation: winOpen .55s cubic-bezier(.2, .8, .2, 1) both, borderPulse 5s ease-in-out 1s infinite; animation-delay: calc(var(--i, 0) * 70ms), 1s; }

/* ---------------- botões ---------------- */
.btn { position: relative; overflow: hidden; }
.btn.pri::after, .btn.gold::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .28), transparent); transform: skewX(-20deg);
}
.fx-full .btn.pri:not([disabled])::after, .fx-full .btn.gold:not([disabled])::after { animation: shimmer 3.4s ease-in-out infinite; }
@keyframes shimmer { 0%, 70% { left: -60%; } 100% { left: 130%; } }
.btn:active:not([disabled]) { box-shadow: 0 0 22px rgba(111, 214, 255, .55); }
.tap-ring { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid var(--glow); animation: tapRing .5s ease-out forwards; }
@keyframes tapRing { to { transform: scale(7); opacity: 0; border-width: 1px; } }

/* ---------------- topo ---------------- */
.coins.up { animation: coinUp .7s ease; }
.coins.down { animation: coinDown .7s ease; }
@keyframes coinUp { 30% { transform: scale(1.25); text-shadow: 0 0 14px var(--gold); } }
@keyframes coinDown { 30% { transform: scale(1.15); color: var(--danger); } }
.save-dot.pulse { animation: savePulse .8s ease; }
@keyframes savePulse { 0% { transform: scale(1); } 40% { transform: scale(2.2); box-shadow: 0 0 14px var(--good); } 100% { transform: scale(1); } }
.top-xp i::after, .bar.xp > i::after, .bar.hp > i::after, .bar.mp > i::after, .bar.boss > i::after {
  content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); background-size: 50% 100%; background-repeat: no-repeat;
}
.fx-full .top-xp i::after, .fx-full .bar.xp > i::after { animation: barShine 3s linear infinite; }
@keyframes barShine { from { background-position: -100% 0; } to { background-position: 250% 0; } }
.bar > i { z-index: 2; }
.bar > .gh { position: absolute; inset: 0 auto 0 0; z-index: 1; background: rgba(255, 255, 255, .7); transition: width .6s ease .35s; }
.bar.hp > .gh, .bar.boss > .gh { background: #ffe0a0; }
.bar.anim > i { transition: width .45s cubic-bezier(.3, .8, .3, 1); }
.bar.anim.late > i { transition-delay: .55s; }
.bar.anim.late > .gh { transition-delay: .9s; }

/* ---------------- navegação ---------------- */
.nav button.on::before { transform-origin: center; }
.fx-full .nav button.on.fresh::before { animation: navLine .35s ease-out both; }
.fx-full .nav button.on.fresh svg { animation: navIcon .45s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes navLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes navIcon { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-5px) scale(1.18); filter: drop-shadow(0 0 6px var(--glow)); } 100% { transform: none; } }
.fx-full .nav .badge { animation: badgePop .4s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes badgePop { from { transform: scale(0); } }

/* ---------------- ecrã de estado ---------------- */
.fx-full .avatar { animation: auraPulse 3.2s ease-in-out infinite; }
@keyframes auraPulse { 0%, 100% { box-shadow: 0 0 12px -2px var(--aura, var(--glow)); } 50% { box-shadow: 0 0 30px 2px var(--aura, var(--glow)); } }
.fx-full .avatar svg, .fx-full .avatar img { animation: breathe 4s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
.hero-title.shine {
  background: linear-gradient(90deg, var(--gold) 0%, #fff2c9 45%, var(--gold) 60%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.fx-full .hero-title.shine { animation: titleShine 4s linear infinite; }
@keyframes titleShine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.fx-full .lv-big { animation: lvGlow 2.6s ease-in-out infinite; }
@keyframes lvGlow { 50% { text-shadow: 0 0 30px rgba(111, 214, 255, .95), 0 0 6px #fff; } }
.fx-full .btn.icon.gold { animation: pointPulse 1.6s ease-in-out infinite; }
@keyframes pointPulse { 50% { box-shadow: 0 0 16px rgba(255, 200, 90, .6); transform: scale(1.06); } }
.stat-v.bump { animation: statBump .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes statBump { 30% { transform: scale(1.5); color: var(--gold); text-shadow: 0 0 14px var(--gold); } }

/* ---------------- missões ---------------- */
.fx-full .cd.urgent { animation: urgent 1s steps(2, start) infinite; }
@keyframes urgent { 50% { opacity: .45; } }
.stamp.slam { animation: slam .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes slam { 0% { transform: scale(3) rotate(-14deg); opacity: 0; } 60% { transform: scale(.9) rotate(-6deg); opacity: 1; } 100% { transform: scale(1) rotate(-6deg); } }
.card.flash { animation: cardFlash .8s ease; }
@keyframes cardFlash { 0% { box-shadow: 0 0 0 2px var(--good), 0 0 30px rgba(91, 224, 138, .6); background: rgba(91, 224, 138, .18); } 100% { box-shadow: none; } }
.card.flash-bad { animation: cardFlashBad .8s ease; }
@keyframes cardFlashBad { 0% { box-shadow: 0 0 0 2px var(--danger), 0 0 30px rgba(255, 90, 110, .6); background: rgba(255, 90, 110, .18); } 100% { box-shadow: none; } }

/* ---------------- modais ---------------- */
.overlay { animation: none; }
.overlay.fresh { animation: fadeIn .2s ease both; }
.sheet { animation: none; }
.sheet.fresh { animation: sheetIn .38s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes sheetIn { 0% { transform: translateY(40px) scaleY(.6); opacity: 0; filter: brightness(2); } 60% { transform: translateY(-4px) scaleY(1.02); opacity: 1; } 100% { transform: none; filter: none; } }
.sys-box { animation: none; position: relative; overflow: hidden; }
.sys-box.fresh { animation: sysOpen .6s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes sysOpen {
  0% { transform: scale(.05, .01); opacity: 0; filter: brightness(4); }
  30% { transform: scale(1, .01); opacity: 1; filter: brightness(3); }
  70% { transform: scale(1, 1.04); filter: brightness(1.3); }
  100% { transform: none; filter: none; }
}
.sys-box.fresh .sys-tag { animation: glitchText .5s steps(1, end) .35s both; }
.sys-box.fresh h2 { animation: glitchText .5s steps(1, end) .45s both; }
.sys-box.fresh .sys-lines li { animation: lineIn .35s ease both; animation-delay: calc(.55s + var(--k, 0) * .12s); }
.sys-box.fresh .btn { animation: fadeIn .3s ease both; animation-delay: calc(.6s + var(--n, 0) * .12s); }
@keyframes lineIn { from { opacity: 0; transform: translateX(-12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.sys-box::before { content: ''; position: absolute; left: 0; right: 0; height: 30%; top: 0; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(111, 214, 255, .18), transparent); transform: translateY(-100%); }
.sys-box.fresh::before { animation: scanSweep 1.2s ease-in .3s both; }

/* subida de nível */
.rays { position: fixed; left: 50%; top: 50%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax; pointer-events: none; z-index: -1;
  background: repeating-conic-gradient(from 0deg, rgba(255, 200, 90, .16) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 55%); mask: radial-gradient(circle, #000 0%, transparent 55%); }
.fx-full .rays { animation: raysSpin 18s linear infinite, fadeIn .8s ease both; }
.rays.blue { background: repeating-conic-gradient(from 0deg, rgba(111, 214, 255, .16) 0deg 6deg, transparent 6deg 18deg); }
@keyframes raysSpin { to { transform: rotate(360deg); } }
.sys-pop { overflow: hidden; }
.sys-box.lvl .big { display: inline-block; }
.sys-box.lvl.fresh .big { animation: lvSlam .9s cubic-bezier(.2, 1.5, .4, 1) .5s both; }
@keyframes lvSlam { 0% { transform: scale(4); opacity: 0; filter: blur(8px); } 50% { transform: scale(.85); opacity: 1; filter: none; } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
.sys-box.lvl.fresh .hero-title { animation: fadeUp .5s ease 1.1s both, titleShine 4s linear 1.6s infinite; }
.lvl-label { font-family: var(--f-display); letter-spacing: .4em; font-size: 12px; color: var(--muted); }
.shock { position: fixed; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid var(--c, var(--gold)); pointer-events: none; z-index: 71;
  animation: shock .9s cubic-bezier(.1, .7, .3, 1) forwards; }
@keyframes shock { from { transform: scale(.2); opacity: 1; } to { transform: scale(28); opacity: 0; border-width: 1px; } }

/* baús */
.chest-stage { position: relative; height: 104px; display: grid; place-items: center; margin: 4px 0 6px; }
.chest-ico { font-size: 68px; line-height: 1; display: inline-block; filter: drop-shadow(0 0 14px var(--c, var(--glow))); }
.sys-box.fresh .chest-ico { animation: chestShake .95s ease-in both, chestPop .4s ease-out .95s forwards; }
@keyframes chestShake {
  0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1); opacity: 1; }
  25% { transform: rotate(-8deg); } 32% { transform: rotate(8deg); } 39% { transform: rotate(-10deg); } 46% { transform: rotate(10deg); }
  55% { transform: rotate(-12deg) scale(1.05); } 64% { transform: rotate(12deg) scale(1.1); } 73% { transform: rotate(-14deg) scale(1.15); }
  82% { transform: rotate(14deg) scale(1.2); } 100% { transform: scale(1.3); filter: drop-shadow(0 0 30px var(--c)) brightness(2); }
}
@keyframes chestPop { to { transform: scale(2.2); opacity: 0; filter: blur(6px) brightness(3); } }
.pillar { position: absolute; left: 50%; bottom: 0; width: 70px; margin-left: -35px; height: 260px; opacity: 0; pointer-events: none;
  background: linear-gradient(0deg, var(--c), transparent); filter: blur(6px); transform-origin: bottom; }
.sys-box.fresh .pillar { animation: pillar 1.6s ease-out .95s both; }
@keyframes pillar { 0% { opacity: 0; transform: scaleY(0) scaleX(.3); } 20% { opacity: .9; transform: scaleY(1) scaleX(1.4); } 100% { opacity: 0; transform: scaleY(1.2) scaleX(.2); } }
.sys-box.loot.fresh .sys-lines li { animation: lootIn .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(1.05s + var(--k, 0) * .22s); }
@keyframes lootIn { 0% { opacity: 0; transform: translateY(-30px) scale(.4); filter: brightness(3); } 100% { opacity: 1; transform: none; filter: none; } }
.sys-box.loot.fresh .btn { animation-delay: calc(1.2s + var(--n, 0) * .22s); }
.sys-lines li.glow { text-shadow: 0 0 10px currentColor; }

/* conquista */
.medal { font-size: 46px; display: inline-block; }
.sys-box.fresh .medal { animation: medal 1s cubic-bezier(.2, 1.4, .4, 1) .3s both; }
@keyframes medal { 0% { transform: rotateY(720deg) scale(0); opacity: 0; } 100% { transform: rotateY(0) scale(1); opacity: 1; } }

/* aviso / penalidade */
.sys-box.bad.fresh { animation: sysOpen .5s cubic-bezier(.2, .9, .3, 1) both, alarm .9s ease .5s 2; }
@keyframes alarm { 50% { box-shadow: 0 0 60px rgba(255, 90, 110, .7); border-color: #ff8a9a; } }
.warn-stripes { height: 8px; margin: -18px -18px 12px; background: repeating-linear-gradient(-45deg, var(--danger) 0 10px, transparent 10px 20px); }
.fx-full .warn-stripes { animation: stripes .8s linear infinite; }
@keyframes stripes { to { background-position: 28px 0; } }

/* ---------------- efeitos soltos ---------------- */
.float-txt { font-family: var(--f-display); font-weight: 800; font-size: 20px; white-space: nowrap; transform: translate(-50%, -50%);
  text-shadow: 0 0 2px #000, 0 2px 0 #000, 0 0 14px currentColor; animation: floatUp 1.3s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(.9); } }
.dmg-num { font-family: var(--f-display); font-weight: 800; font-size: 30px; transform: translate(-50%, -50%); white-space: nowrap; color: #f2f7ff;
  text-shadow: 0 0 2px #000, 2px 2px 0 #000, -1px -1px 0 #000, 0 0 16px rgba(111, 214, 255, .8); animation: dmgPop 1s cubic-bezier(.2, .8, .3, 1) forwards; }
.dmg-num.crit { font-size: 44px; color: var(--gold); text-shadow: 0 0 2px #000, 3px 3px 0 #000, 0 0 22px rgba(255, 176, 46, .95); }
.dmg-num.crit::before { content: 'CRÍTICO'; display: block; font-size: 13px; letter-spacing: .3em; text-align: center; color: #fff2c9; }
.dmg-num.hurt { color: #ff6b7d; text-shadow: 0 0 2px #000, 2px 2px 0 #000, 0 0 16px rgba(255, 60, 80, .9); }
.dmg-num.heal { color: var(--good); text-shadow: 0 0 2px #000, 2px 2px 0 #000, 0 0 16px rgba(91, 224, 138, .9); font-size: 24px; }
.dmg-num.miss { color: var(--glow); font-size: 22px; letter-spacing: .15em; }
.dmg-num.small { font-size: 20px; }
@keyframes dmgPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(.9); } 30% { transform: translate(-50%, -60%) scale(1.05); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }

.slash { height: 4px; width: 220px; margin: -2px 0 0 -110px; border-radius: 4px; transform-origin: 50% 50%;
  background: linear-gradient(90deg, transparent, #fff 35%, var(--c, var(--glow)) 60%, transparent); box-shadow: 0 0 18px var(--c, var(--glow)), 0 0 4px #fff;
  animation: slash .38s ease-out forwards; }
@keyframes slash { 0% { transform: rotate(var(--r)) scaleX(0); opacity: 1; } 45% { transform: rotate(var(--r)) scaleX(1.05); opacity: 1; } 100% { transform: rotate(var(--r)) scaleX(1.1) scaleY(.2); opacity: 0; } }
.magic-circle { width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
  border: 2px dashed var(--c, var(--glow)); box-shadow: 0 0 24px var(--c, var(--glow)), inset 0 0 30px var(--c, var(--glow));
  animation: magicCircle .75s ease-out forwards; }
.magic-circle::before { content: ''; position: absolute; inset: 22px; border-radius: 50%; border: 1px solid var(--c, var(--glow)); }
.magic-circle::after { content: ''; position: absolute; inset: 44px; border: 1px solid var(--c, var(--glow)); transform: rotate(45deg); }
@keyframes magicCircle { 0% { transform: scale(.1) rotate(0deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.4) rotate(200deg); opacity: 0; } }
.impact { width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--c, var(--glow)) 40%, transparent 70%); animation: impact .45s ease-out forwards; }
@keyframes impact { from { transform: scale(.3); opacity: 1; } to { transform: scale(5); opacity: 0; } }
.arrow-streak { width: 4px; height: 160px; margin-left: -2px; background: linear-gradient(0deg, transparent, var(--c, var(--glow)), #fff); box-shadow: 0 0 12px var(--c); transform-origin: top; animation: arrow .32s ease-in forwards; }
@keyframes arrow { 0% { transform: translateY(260px) rotate(var(--r)); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-40px) rotate(var(--r)); opacity: 0; } }
.wisp { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 50% 40%, #fff, var(--c) 45%, transparent 70%); filter: blur(1px); animation: wisp .7s ease-in forwards; }
@keyframes wisp { 0% { transform: translate(var(--dx), 140px) scale(.5); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(0, 0) scale(1.6); opacity: 0; } }
.chains { width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 6px dotted var(--violet); animation: chains .8s ease-out forwards; }
@keyframes chains { 0% { transform: scale(1.8) rotate(0); opacity: 0; } 40% { opacity: 1; transform: scale(.8) rotate(90deg); } 100% { transform: scale(.7) rotate(120deg); opacity: 0; } }
.stars { width: 120px; height: 30px; margin: -90px 0 0 -60px; text-align: center; font-size: 22px; animation: stars 1s linear forwards; }
@keyframes stars { 0% { transform: rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: rotate(360deg); opacity: 0; } }
.buff-up { font-family: var(--f-display); font-size: 26px; color: var(--glow); margin-left: -10px; animation: buffUp .9s ease-out forwards; text-shadow: 0 0 12px var(--glow); }
@keyframes buffUp { from { transform: translateY(20px); opacity: 0; } 40% { opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
.screen-flash { inset: 0; animation: screenFlash .45s ease-out forwards; }
@keyframes screenFlash { from { opacity: var(--o, .5); } to { opacity: 0; } }
.hurt-vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 30, 60, .55) 100%); animation: screenFlash .7s ease-out forwards; }

.banner { left: 0; right: 0; top: 38%; padding: 14px 0; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 34px; letter-spacing: .3em; color: #fff;
  background: linear-gradient(90deg, transparent, var(--c, rgba(111, 214, 255, .5)) 20%, var(--c, rgba(111, 214, 255, .5)) 80%, transparent);
  text-shadow: 0 0 18px var(--c2, var(--glow)), 0 2px 0 #000; animation: banner 1.7s cubic-bezier(.2, .8, .2, 1) forwards; }
.banner small { display: block; font-size: 13px; letter-spacing: .35em; font-weight: 600; opacity: .9; }
@keyframes banner {
  0% { transform: translateX(-110%) skewX(-20deg); opacity: 0; } 18% { transform: translateX(0) skewX(-8deg); opacity: 1; }
  28% { transform: none; } 78% { transform: none; opacity: 1; clip-path: inset(0); } 100% { transform: translateX(30%) skewX(-10deg); opacity: 0; clip-path: inset(40% 0 40% 0); }
}

/* portal de entrada no portão */
.portal { left: 50%; top: 45%; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; border-radius: 50%;
  background:
    radial-gradient(circle, #000 0 14%, transparent 15%),
    repeating-conic-gradient(from 0deg, var(--c) 0deg 10deg, #050912 10deg 24deg),
    radial-gradient(circle, var(--c), #050912 70%);
  -webkit-mask: radial-gradient(circle, #000 55%, transparent 71%); mask: radial-gradient(circle, #000 55%, transparent 71%);
  animation: portal 1.25s cubic-bezier(.6, 0, .3, 1) forwards; }
@keyframes portal {
  0% { transform: scale(0) rotate(0deg); opacity: 1; filter: brightness(1.5); }
  45% { transform: scale(1.1) rotate(220deg); opacity: 1; filter: brightness(1); }
  70% { transform: scale(1.4) rotate(330deg); opacity: 1; }
  100% { transform: scale(3) rotate(420deg); opacity: 0; }
}
.boss-ico.spawn { animation: spawn 1s cubic-bezier(.2, 1.3, .4, 1) .55s both; }
@keyframes spawn { 0% { transform: scale(.2); filter: blur(10px) brightness(4); opacity: 0; } 100% { transform: none; filter: drop-shadow(0 0 18px rgba(255, 90, 110, .45)); opacity: 1; } }

/* combate */
.boss-wrap { position: relative; display: inline-block; }
.boss-aura { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, var(--c, rgba(255, 60, 90, .5)), transparent 65%); }
.fx-full .boss-aura { animation: bossAura 2.4s ease-in-out infinite; }
@keyframes bossAura { 0%, 100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1.15); opacity: .95; } }
.fx-full .boss-ico:not(.hit):not(.spawn):not(.dying) { animation: bossIdle 3s ease-in-out infinite; }
@keyframes bossIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.boss-ico.hit { animation: bossHit .4s ease !important; }
@keyframes bossHit { 0% { filter: brightness(4) saturate(0); } 20% { transform: translateX(-10px) rotate(-5deg); } 40% { transform: translateX(8px) rotate(4deg); filter: brightness(2); } 70% { transform: translateX(-3px); } 100% { filter: drop-shadow(0 0 18px rgba(255, 90, 110, .45)); } }
.boss-ico.dying { animation: dying 1.2s ease-in forwards !important; }
@keyframes dying { 0% { filter: brightness(3); } 30% { transform: scale(1.15); filter: brightness(4) saturate(0); } 100% { transform: scale(1.6) translateY(-20px); opacity: 0; filter: blur(14px) brightness(5); } }
.boss-ico.dead { opacity: 0; }
.fx-full .phase-2 .boss-aura { --c: rgba(255, 30, 60, .8); animation-duration: 1.2s; }
.fx-full .phase-3 .boss-aura { --c: rgba(181, 108, 255, .9); animation-duration: .8s; }
.ppanel.hit { animation: panelHit .45s ease; }
@keyframes panelHit { 0% { box-shadow: 0 0 0 2px var(--danger), 0 0 40px rgba(255, 60, 80, .7); } 100% { box-shadow: none; } }
.ppanel.healed { animation: panelHeal .7s ease; }
@keyframes panelHeal { 0% { box-shadow: 0 0 0 2px var(--good), 0 0 40px rgba(91, 224, 138, .6); } 100% { box-shadow: none; } }
.actions.busy .btn { pointer-events: none; opacity: .65; }
.log > div:last-child { animation: fadeUp .3s ease both; }

/* tremer o ecrã */
.shake-1 { animation: shake1 .3s ease; }
.shake-2 { animation: shake2 .45s ease; }
.shake-3 { animation: shake3 .65s ease; }
@keyframes shake1 { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
@keyframes shake2 { 15% { transform: translate(-7px, 3px) rotate(-.6deg); } 30% { transform: translate(6px, -4px) rotate(.5deg); } 50% { transform: translate(-5px, 2px); } 70% { transform: translate(3px, -2px); } 85% { transform: translate(-2px, 1px); } }
@keyframes shake3 { 10% { transform: translate(-12px, 6px) rotate(-1deg); } 25% { transform: translate(11px, -7px) rotate(1deg); } 40% { transform: translate(-9px, 4px); } 55% { transform: translate(7px, -4px); } 70% { transform: translate(-4px, 2px); } 85% { transform: translate(2px, -1px); } }
.defeat-tint { filter: grayscale(.85) brightness(.8); transition: filter .8s ease; }

/* despertar (intro) */
.awaken { inset: 0; display: grid; place-items: center; animation: awakenBg 2.1s ease forwards; background: radial-gradient(circle at 50% 70%, rgba(111, 214, 255, .35), rgba(2, 4, 10, .96) 60%); }
@keyframes awakenBg { 0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
.awaken .col { position: absolute; left: 50%; bottom: 0; width: 120px; margin-left: -60px; height: 100%; background: linear-gradient(0deg, var(--c), transparent 85%); filter: blur(10px); transform-origin: bottom; animation: awakenCol 1.6s ease-out forwards; }
@keyframes awakenCol { 0% { transform: scaleY(0) scaleX(.2); } 40% { transform: scaleY(1) scaleX(1.6); } 100% { transform: scaleY(1) scaleX(.1); opacity: 0; } }
.awaken .word { position: relative; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 10vw, 54px); letter-spacing: .3em; color: #fff; text-shadow: 0 0 30px var(--c), 0 0 8px #fff; animation: awakenWord 1.8s ease forwards; }
.awaken .word small { display: block; text-align: center; font-size: 14px; letter-spacing: .4em; color: var(--glow); margin-top: 8px; }
@keyframes awakenWord { 0% { opacity: 0; transform: scale(.6); filter: blur(10px); } 30% { opacity: 1; transform: scale(1); filter: none; } 75% { opacity: 1; letter-spacing: .3em; } 100% { opacity: 0; letter-spacing: .6em; filter: blur(4px); } }
.intro .win.boot { animation: winOpen .7s cubic-bezier(.2, .8, .2, 1) .2s both; }
.type .cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom; background: var(--glow); margin-left: 2px; animation: urgent .8s steps(2, start) infinite; }
.fx-full .class-card { transition: transform .2s, box-shadow .2s, border-color .2s; }
.fx-full .class-card.on { animation: classPick .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes classPick { 40% { transform: scale(1.06); box-shadow: 0 0 0 1px var(--glow) inset, 0 0 40px rgba(111, 214, 255, .5); } }


.coins b { font-weight: inherit; }

/* ---------------- avatares com imagem ---------------- */
.avatar.has-img { aspect-ratio: 9 / 17; }
.avatar.has-img img { object-fit: cover; object-position: 50% 0; }
.avatar.sm.has-img { width: 56px; }
.class-card .art { margin: -10px -10px 2px; aspect-ratio: 4 / 5; overflow: hidden; border-bottom: 1px solid var(--line); background: #050912; }
.class-card .art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; display: block; transition: transform .4s ease, filter .4s ease; filter: saturate(.75) brightness(.8); }
.class-card.on .art img { filter: none; transform: scale(1.06); }
.class-detail { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.class-detail .avatar { width: 96px; }
.evo { display: grid; place-items: center; margin: 4px 0 8px; }
.evo .avatar { width: 120px; }
.sys-box.fresh .evo .avatar { animation: evoIn 1.1s cubic-bezier(.2, 1.3, .4, 1) .9s both, auraPulse 3.2s ease-in-out 2s infinite; }
@keyframes evoIn { 0% { opacity: 0; transform: scale(.6); filter: brightness(5) blur(6px); } 60% { opacity: 1; filter: brightness(2); } 100% { transform: none; filter: none; } }
.evo-label { font-family: var(--f-display); font-size: 11px; letter-spacing: .3em; color: var(--gold); margin-top: 6px; }

/* ---------------- arte dos chefes ---------------- */
.ico.boss-thumb.has-art { width: 58px; height: 84px; padding: 0; overflow: hidden; border-color: var(--line-hi); }
.ico.boss-thumb.has-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.card.done .boss-thumb img { filter: grayscale(1) brightness(.6); }
.boss-hero { margin: -4px -4px 12px; height: 260px; overflow: hidden; border: 1px solid var(--line-hi); position: relative; background: #050912; }
.boss-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--panel-solid)); pointer-events: none; }
.boss-hero-img, .boss-hero-img img { width: 100%; height: 100%; display: block; }
.boss-hero-img img { object-fit: cover; object-position: 50% 18%; }
.fx-full .sheet.fresh .boss-hero-img img { animation: heroZoom 6s ease-out both; }
@keyframes heroZoom { from { transform: scale(1.18); filter: brightness(1.8); } 20% { filter: none; } to { transform: scale(1); } }
.boss-ico.has-art { font-size: 0; width: 168px; height: 250px; border: 1px solid rgba(255, 90, 110, .45); overflow: hidden; border-radius: 4px; position: relative;
  -webkit-mask: linear-gradient(180deg, #000 78%, transparent); mask: linear-gradient(180deg, #000 78%, transparent); }
.boss-ico.has-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.boss-panel .boss-aura { width: 230px; height: 230px; margin: -115px 0 0 -115px; }
.victory-art { width: 120px; height: 160px; margin: 0 auto 10px; overflow: hidden; border: 1px solid var(--gold); }
.victory-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; filter: grayscale(.9) brightness(.7); }
.sys-box.fresh .victory-art img { animation: defeated 1.2s ease .3s both; }
@keyframes defeated { from { filter: none; transform: scale(1.1); } to { filter: grayscale(.9) brightness(.7); transform: none; } }

/* ---------------- grelha de chefes ---------------- */
.win { overflow: hidden; }
.boss-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.boss-tile { padding: 0; gap: 0; display: block; position: relative; aspect-ratio: 3 / 4; overflow: hidden; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--dg) 45%, var(--line)); background: #050912; }
.boss-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; transition: transform .35s ease, filter .35s ease; }
.boss-tile:hover img, .boss-tile:focus-visible img { transform: scale(1.07); }
.boss-tile .bt-ico { position: absolute; inset: 0 0 30% 0; display: grid; place-items: center; font-size: 40px; }
.boss-tile::after { content: ''; position: absolute; inset: 40% 0 0 0; background: linear-gradient(180deg, transparent, rgba(4, 7, 14, .95) 70%); pointer-events: none; }
.bt-info { position: absolute; left: 6px; right: 6px; bottom: 5px; z-index: 2; display: grid; gap: 1px; }
.bt-name { font-family: var(--f-display); font-weight: 700; font-size: 12px; line-height: 1.15; color: #f2f7ff; text-shadow: 0 1px 2px #000;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bt-dg { font-family: var(--f-display); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dg); }
.bt-lv { position: absolute; top: 5px; left: 5px; z-index: 2; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: rgba(4, 7, 14, .8); border: 1px solid var(--line-hi); }
.bt-crown { position: absolute; top: 3px; right: 6px; z-index: 2; color: var(--gold); font-size: 16px; text-shadow: 0 0 8px var(--gold); }
.boss-tile.king { border-color: rgba(255, 200, 90, .7); box-shadow: 0 0 14px rgba(255, 200, 90, .2); }
.boss-tile.done { opacity: 1; }
.boss-tile.done img { filter: grayscale(1) brightness(.45); }
.boss-tile.done::before { content: '✓'; position: absolute; z-index: 3; top: 30%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); font-family: var(--f-display); font-size: 34px; color: var(--good); text-shadow: 0 0 12px var(--good); }
@media (min-width: 480px) { .boss-grid { gap: 10px; } .bt-name { font-size: 13px; } }

/* ---------------- loja: condições ---------------- */
.shop-count { margin: -4px 0 10px; }
.reqs { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px; }
.req { font-size: 12px; font-family: var(--f-mono); }
.req.ok { color: var(--good); }
.req.no { color: #ff9aa6; }
.shop-card.locked { opacity: .78; border-style: dashed; }
.shop-card.locked .ico { filter: grayscale(.8); }
.locked-tag { color: #ff9aa6; border-color: rgba(255, 90, 110, .45); }

/* ---------------- troféus ---------------- */
.trophy-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 380px) { .trophy-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.trophy { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--line); background: #050912; border-radius: 3px; }
.trophy img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(1) brightness(.18); }
.trophy .tr-ico { position: absolute; inset: 0 0 30% 0; display: grid; place-items: center; font-size: 26px; filter: grayscale(1) brightness(.4); }
.trophy.got { border-color: var(--rc); box-shadow: 0 0 10px color-mix(in srgb, var(--rc) 45%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--rc) 50%, transparent); }
.trophy.got img { filter: saturate(1.1); }
.trophy.got .tr-ico { filter: none; }
.trophy::after { content: ''; position: absolute; inset: 45% 0 0 0; background: linear-gradient(180deg, transparent, rgba(4, 7, 14, .95)); }
.tr-name { position: absolute; left: 3px; right: 3px; bottom: 3px; z-index: 2; font-family: var(--f-display); font-size: 9.5px; line-height: 1.1; color: #f2f7ff;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px #000; }
.trophy:not(.got) .tr-name { color: var(--faint); }
.tr-lock { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); z-index: 2; font-size: 16px; opacity: .6; }
.set-bonus { margin-top: 10px; font-size: 13px; color: var(--muted); }
.set-bonus.on { color: var(--gold); }
.trophy-won { margin-top: 8px; font-family: var(--f-display); color: var(--gold); text-shadow: 0 0 10px rgba(255, 200, 90, .6); }
.sys-box.fresh .trophy-won { animation: lootIn .6s cubic-bezier(.2, 1.4, .4, 1) .5s both; }

/* ---------------- imagens dos itens ---------------- */
.ico.has-img { padding: 0; overflow: hidden; border-color: color-mix(in srgb, var(--rc) 55%, var(--line)); box-shadow: inset 0 0 10px color-mix(in srgb, var(--rc) 25%, transparent); }
.ico.has-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ico.big.has-img { width: 88px; height: 88px; }
.tiny-ico { width: 22px; height: 22px; object-fit: cover; vertical-align: middle; border-radius: 3px; margin-right: 2px; }

.chest-ico img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; display: block; }

/* ---------------- falas dos chefes ---------------- */
.speech { position: relative; margin: 10px auto 2px; max-width: 420px; text-align: left; padding: 10px 12px 10px 14px; border: 1px solid rgba(255, 90, 110, .45);
  background: linear-gradient(180deg, rgba(40, 6, 14, .85), rgba(10, 6, 14, .9)); border-radius: 4px; }
.speech::before { content: ''; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg);
  background: rgba(40, 6, 14, .95); border-left: 1px solid rgba(255, 90, 110, .45); border-top: 1px solid rgba(255, 90, 110, .45); }
.speech-name { display: block; font-family: var(--f-display); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #ff8a9a; margin-bottom: 4px; }
.speech-txt { display: block; font-family: var(--f-display); font-size: 15px; line-height: 1.4; color: #f5e9ec; font-style: italic; }
.speech.last { border-color: rgba(255, 200, 90, .45); background: linear-gradient(180deg, rgba(30, 22, 6, .85), rgba(10, 8, 6, .9)); }
.speech.last::before { background: rgba(30, 22, 6, .95); border-color: rgba(255, 200, 90, .45); }
.speech.last .speech-name { color: var(--gold); }
.speech.last .speech-txt { color: #efe6d2; }
.fx-full .speech.fresh { animation: speechIn .6s cubic-bezier(.2, .9, .3, 1) .9s both; }
.fx-full .speech.fresh .speech-txt { animation: speechType 1.6s steps(40, end) 1.2s both; }
.fx-full .speech.last.fresh { animation-delay: 1.4s; }
.fx-full .speech.last.fresh .speech-txt { animation-delay: 1.7s; animation-duration: 2.2s; }
@keyframes speechIn { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes speechType { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.log .say { color: #ffb3bf; font-style: italic; font-family: var(--f-display); }
.last-words { font-family: var(--f-display); font-style: italic; color: #efe6d2; margin: 10px 4px 0; line-height: 1.4; }
.sys-box.fresh .last-words { animation: fadeUp .6s ease .4s both; }

/* ---------------- ícones da interface (imagens) ---------------- */
.ui-ico { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; margin-right: 4px; border-radius: 3px; }
.chip .ui-ico { width: 20px; height: 20px; margin: -3px 4px -3px -4px; }
.nav button .ui-ico.nav-img { width: 26px; height: 26px; margin: 0; opacity: .55; filter: grayscale(.6); transition: opacity .2s, filter .2s; }
.nav button.on .ui-ico.nav-img { opacity: 1; filter: drop-shadow(0 0 6px var(--glow)); }
.win-h .ui-ico { width: 22px; height: 22px; }
.menu-img { width: 22px; height: 22px; }

.ui-ico.gate-head { width: 34px; height: 34px; margin: -8px 8px -8px 0; }
.chip .ui-ico { width: 22px; height: 22px; }
.win-h > span:first-child { display: inline-flex; align-items: center; min-width: 0; }
.ui-ico.gate-head { width: 30px; height: 30px; margin: -8px 8px -8px 0; flex: none; }

/* ---------------- ícones de habilidades e troféus ---------------- */
.skill-ico { width: 46px; height: 46px; }
.skill-btn.has-ico { grid-template-columns: 44px 1fr auto; }
.skill-btn.has-ico .sk-b { grid-row: span 2; width: 44px; height: 44px; align-self: center; }
.skill-btn.has-ico small { grid-column: 2 / -1; }
.trophy.t-art img { object-position: 50% 50%; }
.trophy.t-art:not(.got) img { filter: grayscale(1) brightness(.15); }
.trophy-won { display: flex; align-items: center; justify-content: center; gap: 8px; }
.trophy-img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid var(--gold); box-shadow: 0 0 14px rgba(255, 200, 90, .45); }

/* ---------------- relógio do Sistema ---------------- */
.phase-chip { font-size: 15px; line-height: 1; filter: drop-shadow(0 0 6px rgba(255, 220, 140, .5)); }
.tag.phase.on { color: var(--good); border-color: rgba(91, 224, 138, .5); }
.tag.phase.off { color: var(--muted); border-style: dashed; }

/* troféus bloqueados: totalmente ocultos */
.trophy.locked { background: repeating-linear-gradient(135deg, #070b16 0 6px, #0a1020 6px 12px); border-color: #16223a; }
.trophy.locked::after { display: none; }
.trophy.locked .tr-seal { position: absolute; inset: 22%; border: 1px solid #1d2b47; transform: rotate(45deg); }
.trophy.locked .tr-lock { top: 50%; opacity: .45; filter: grayscale(1); font-size: 18px; }
