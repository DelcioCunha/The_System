# Publica o servidor da loja.
name: Publicar Loja (servidor)
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/loja.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: loja-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do servidor
        working-directory: server
        run: npm test
      - name: Verificar segredos
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!s}" ] || { echo "::error::Falta o segredo $s (ver LOJA.md)"; exit 1; }; done
          [ -n "${{ secrets.ADMIN_USER }}" ] || { echo "::error::Falta o segredo ADMIN_USER"; exit 1; }
          [ ${#ADMIN_PASSWORD} -ge 10 ] || { echo "::error::ADMIN_PASSWORD em falta ou com menos de 10 caracteres"; exit 1; }
          [ ${#CODE_PEPPER} -ge 20 ] || { echo "::error::CODE_PEPPER em falta ou demasiado curto (usa 40+ caracteres)"; exit 1; }
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
      - name: Base de dados D1 (cria na primeira vez)
        working-directory: server
        run: |
          ID=$(npx -y wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='sistema-loja');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$ID" ]; then
            npx -y wrangler@4 d1 create sistema-loja
            ID=$(npx -y wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==='sistema-loja').uuid)})")
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx -y wrangler@4 d1 migrations apply sistema-loja --remote
      - name: Publicar o Worker
        id: deploy
        working-directory: server
        run: |
          MODE="${{ vars.LOJA_MODE }}"; [ "$MODE" = "staging" ] || MODE=production
          npx -y wrangler@4 deploy --var MODE:$MODE | tee deploy.log
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Loja publicada ($MODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Endereço do servidor: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Segredos do servidor
        working-directory: server
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CODE_PEPPER: ${{ secrets.CODE_PEPPER }}
        run: |
          printf '%s' "$ADMIN_USER" | npx -y wrangler@4 secret put ADMIN_USER
          node tools/hash-password.mjs "$ADMIN_PASSWORD" | tr -d '\n' | npx -y wrangler@4 secret put ADMIN_PASS_HASH
          printf '%s' "$CODE_PEPPER" | npx -y wrangler@4 secret put CODE_PEPPER
      - name: Guardar o endereço em loja.json (o jogo e o Admin passam a usá-lo)
        if: steps.deploy.outputs.url != ''
        run: |
          printf '{\n  "api": "%s"\n}\n' "${{ steps.deploy.outputs.url }}" > loja.json
          if ! git diff --quiet loja.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add loja.json
            git commit -m "Loja: endereço do servidor"
            git push
          fi
